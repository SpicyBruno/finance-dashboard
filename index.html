<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prospetto Finanziario Personale — Dashboard</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f0e0c">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanze">
  <link
    href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200;300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
    rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --font-ui: 'Stack Sans Notch', system-ui, sans-serif;
      --font-number: 'Stack Sans Notch', system-ui, sans-serif;
      --font-display: 'Source Serif 4', Georgia, serif;
      --bg: #0f0e0c;
      --bg-2: #14120f;
      --card: #1a1815;
      --card-solid: #1a1815;
      --card-hover: #211e1a;
      --border: #2d2925;
      --border-light: #3a342e;
      --text: #f5f1ea;
      --text-dim: #a39588;
      --text-muted: #6b6258;
      --gold: #c9a961;
      --gold-dim: #8a7544;
      --rust: #b85c38;
      --sage: #6b8e6f;
      --danger: #c54545;
      --purple: #8b6f9c;
      --teal: #6b8e9c;
      --shadow: rgba(0, 0, 0, 0.26);
      --on-accent: #0f0e0c;
      --body-gradient: radial-gradient(1200px 600px at -10% -10%, rgba(201, 169, 97, 0.06), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(184, 92, 56, 0.05), transparent 60%);
      --image-opacity: 0.08;
      --image-blend: screen;
      --page-overlay: linear-gradient(180deg, rgba(15, 14, 12, 0.3), rgba(15, 14, 12, 0.58));
      --nav-bg: linear-gradient(180deg, var(--bg-2), var(--bg));
      --topbar-bg: linear-gradient(180deg, var(--bg-2), transparent);
      --card-bg: linear-gradient(180deg, var(--card), var(--bg-2));
      --surface-soft: rgba(255, 255, 255, 0.025);
      --surface-hover: rgba(255, 255, 255, 0.03);
      --accent-soft: rgba(201, 169, 97, 0.08);
      --accent-subtle: rgba(201, 169, 97, 0.06);
      --accent-selected: rgba(201, 169, 97, 0.1);
      --modal-backdrop: rgba(0, 0, 0, 0.62);
      --income-soft: rgba(107, 142, 111, 0.12);
      --expense-soft: rgba(184, 92, 56, 0.12);
      --income-text: #9bc09f;
      --expense-text: #d98a63;
      --badge-sage-text: #9bc09f;
      --badge-rust-text: #d98a63;
      --badge-teal-text: #8fb3c2;
      --badge-purple-text: #b193c0;
    }

    html[data-theme="light"] {
      --bg: #f5f0e7;
      --bg-2: #ebe2d4;
      --card: rgba(255, 252, 246, 0.88);
      --card-solid: #fffaf2;
      --card-hover: rgba(255, 252, 246, 0.96);
      --border: rgba(94, 75, 52, 0.18);
      --border-light: rgba(94, 75, 52, 0.3);
      --text: #241d16;
      --text-dim: #6e5d4b;
      --text-muted: #9b8a78;
      --gold: #9f7626;
      --gold-dim: #d8bd7a;
      --rust: #a44f32;
      --sage: #567a5c;
      --danger: #b23a3a;
      --purple: #745982;
      --teal: #557e8b;
      --shadow: rgba(76, 56, 32, 0.12);
      --on-accent: #fffaf2;
      --body-gradient: linear-gradient(135deg, rgba(255, 252, 246, 0.84), rgba(245, 240, 231, 0.9)),
        radial-gradient(1200px 600px at -10% -10%, rgba(159, 118, 38, 0.12), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(164, 79, 50, 0.08), transparent 60%);
      --image-opacity: 0.13;
      --image-blend: multiply;
      --page-overlay: linear-gradient(180deg, rgba(255, 252, 246, 0.76), rgba(245, 240, 231, 0.88)),
        radial-gradient(900px 620px at 70% 0%, rgba(255, 250, 242, 0.62), transparent 70%);
      --nav-bg: linear-gradient(180deg, rgba(255, 250, 242, 0.94), rgba(235, 226, 212, 0.9));
      --topbar-bg: linear-gradient(180deg, rgba(255, 250, 242, 0.92), rgba(255, 250, 242, 0.62), transparent);
      --card-bg: linear-gradient(180deg, var(--card), rgba(255, 250, 242, 0.74));
      --surface-soft: rgba(255, 252, 246, 0.58);
      --surface-hover: rgba(159, 118, 38, 0.06);
      --accent-soft: rgba(159, 118, 38, 0.1);
      --accent-subtle: rgba(159, 118, 38, 0.08);
      --accent-selected: rgba(159, 118, 38, 0.12);
      --modal-backdrop: rgba(55, 42, 29, 0.34);
      --income-soft: rgba(86, 122, 92, 0.13);
      --expense-soft: rgba(164, 79, 50, 0.13);
      --income-text: #3f6546;
      --expense-text: #8d422c;
      --badge-sage-text: #3f6546;
      --badge-rust-text: #8d422c;
      --badge-teal-text: #3f6874;
      --badge-purple-text: #654a72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      font-variant-numeric: tabular-nums lining-nums;
    }

    body {
      background-image: var(--body-gradient);
      background-attachment: fixed;
      position: relative;
      min-height: 100dvh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('download (42).jpg') center/cover no-repeat;
      opacity: var(--image-opacity);
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: var(--image-blend);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--page-overlay);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
    }

    input,
    select,
    textarea {
      color: var(--text) !important;
      color-scheme: dark;
      font-family: inherit;
    }

    button,
    input,
    select,
    textarea {
      min-height: 44px;
    }

    input::placeholder {
      color: var(--text-muted) !important;
    }

    select option {
      background: var(--card-solid);
      color: var(--text);
    }

    html[data-theme="light"] input,
    html[data-theme="light"] select,
    html[data-theme="light"] textarea {
      color-scheme: light;
    }

    .display-font {
      font-family: var(--font-display);
      font-optical-sizing: auto;
      letter-spacing: -0.01em;
    }

    .number-display {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }

    .mono-font {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }

    button {
      font-family: inherit;
    }

    /* ── App shell ── */
    .app-shell {
      display: grid;
      grid-template-columns: 72px 1fr;
      min-height: 100dvh;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--nav-bg);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100dvh;
      z-index: 10;
    }

    .sidebar-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: radial-gradient(circle at 30% 30%, var(--gold), var(--gold-dim));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 20px;
      margin-bottom: 16px;
      box-shadow: 0 16px 36px rgba(159, 118, 38, 0.26);
    }

    .side-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
      position: relative;
    }

    .side-label {
      display: none;
    }

    .side-btn:hover {
      color: var(--text);
      border-color: var(--border);
      background: var(--surface-hover);
    }

    .side-btn.active {
      color: var(--gold);
      background: var(--accent-soft);
      border-color: var(--gold-dim);
      box-shadow: 0 12px 28px var(--shadow), inset 0 0 20px rgba(201, 169, 97, 0.05);
    }

    .side-btn .tooltip {
      position: absolute;
      left: 54px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      border-radius: 4px;
      z-index: 100;
    }

    .side-btn:hover .tooltip {
      opacity: 1;
    }

    /* ── Main area ── */
    .main-area {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 24px 32px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
    }

    .topbar-title .eyebrow {
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .topbar-title h1 {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .topbar-title h1 span,
    .card-title span,
    .display-font {
      font-style: normal !important;
    }

    .topbar-meta {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.06em;
      border-radius: 6px;
    }

    .icon-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--accent-subtle);
    }

    .input-cell {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text) !important;
      padding: 8px 4px;
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 14px;
      width: 100%;
      transition: border-color 0.2s;
    }

    .input-cell:focus {
      outline: none;
      border-bottom-color: var(--gold);
    }

    .input-label {
      font-family: var(--font-ui);
      background: transparent;
      border: none;
      color: var(--text) !important;
      padding: 8px 4px;
      font-size: 14px;
      width: 100%;
      border-bottom: 1px solid transparent;
    }

    .input-label:focus {
      outline: none;
      border-bottom-color: var(--gold);
    }

    /* ── Content / bento ── */
    main {
      padding: 24px 32px 48px;
      flex: 1;
    }

    .bento {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: minmax(140px, auto);
      gap: 16px;
    }

    .bento-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
      box-shadow: 0 20px 48px var(--shadow);
      backdrop-filter: blur(12px);
    }

    .bento-card:hover {
      border-color: var(--border-light);
    }

    .bento-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(600px 200px at 100% 0%, rgba(159, 118, 38, 0.08), transparent 60%);
    }

    .bento-card.accent-rust::before {
      background: radial-gradient(500px 200px at 0% 100%, rgba(164, 79, 50, 0.09), transparent 60%);
    }

    .bento-card.accent-sage::before {
      background: radial-gradient(500px 200px at 100% 100%, rgba(86, 122, 92, 0.09), transparent 60%);
    }

    .bento-card>* {
      position: relative;
      z-index: 1;
    }

    .span-3 {
      grid-column: span 3;
    }

    .span-4 {
      grid-column: span 4;
    }

    .span-5 {
      grid-column: span 5;
    }

    .span-6 {
      grid-column: span 6;
    }

    .span-7 {
      grid-column: span 7;
    }

    .span-8 {
      grid-column: span 8;
    }

    .span-9 {
      grid-column: span 9;
    }

    .span-12 {
      grid-column: span 12;
    }

    .row-2 {
      grid-row: span 2;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      font-style: normal;
      color: var(--text);
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title .diamond {
      color: var(--gold);
      margin-right: 6px;
    }

    .card-eyebrow {
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .kpi-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 30px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-style: normal;
      margin-top: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 12px 0;
      margin-right: 22px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 14px;
      letter-spacing: 0.02em;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      font-style: normal;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .row-delete {
      opacity: 0;
      transition: opacity 0.2s;
    }

    .data-row:hover .row-delete {
      opacity: 1;
    }

    .recharts-cartesian-axis-tick-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 11px;
    }

    /* Progress bar */
    .progress-track {
      height: 8px;
      background: rgba(94, 75, 52, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: var(--on-accent);
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      z-index: 1000;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
      pointer-events: none;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes toastOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    /* ── Movimenti: badge, modal, tabella ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge-sage { background: var(--income-soft); color: var(--badge-sage-text); border-color: rgba(107, 142, 111, 0.35); }
    .badge-rust { background: var(--expense-soft); color: var(--badge-rust-text); border-color: rgba(184, 92, 56, 0.35); }
    .badge-gold { background: var(--accent-subtle); color: var(--gold); border-color: rgba(201, 169, 97, 0.35); }
    .badge-teal { background: rgba(107, 142, 156, 0.14); color: var(--badge-teal-text); border-color: rgba(107, 142, 156, 0.35); }
    .badge-purple { background: rgba(139, 111, 156, 0.14); color: var(--badge-purple-text); border-color: rgba(139, 111, 156, 0.35); }
    .badge-neutral { background: rgba(94, 75, 52, 0.07); color: var(--text-dim); border-color: var(--border); }

    .tx-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 880px; }
    .tx-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .tx-table th.sortable { cursor: pointer; user-select: none; transition: color 0.15s; }
    .tx-table th.sortable:hover { color: var(--text-dim); }
    .tx-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tx-table tbody tr { transition: background 0.15s; }
    .tx-table tbody tr:hover { background: var(--surface-hover); }
    .tx-table th.sel, .tx-table td.sel { width: 34px; text-align: center; padding-left: 10px; padding-right: 4px; }
    .tx-table tbody tr.selected { background: var(--accent-soft); }
    .tx-table tbody tr.selected:hover { background: var(--accent-selected); }
    .tx-bulkbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--accent-subtle); }
    .btn-danger {
      background: transparent; border: 1px solid var(--danger); color: var(--danger);
      padding: 8px 14px; cursor: pointer; font-family: inherit; font-size: 12px; letter-spacing: 0.06em;
      border-radius: 6px; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-danger:hover { background: rgba(197, 69, 69, 0.12); }
    .tx-desc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-mobile-list { display: none; }
    .tx-mobile-card {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .tx-mobile-card.selected {
      border-color: var(--gold-dim);
      background: var(--accent-soft);
    }
    .tx-mobile-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .tx-mobile-desc {
      color: var(--text);
      font-size: 15px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .tx-mobile-meta,
    .tx-mobile-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tx-mobile-meta {
      color: var(--text-dim);
      font-size: 12px;
    }
    .tx-mobile-actions {
      justify-content: space-between;
      padding-top: 4px;
    }
    .tx-action-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 6px;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
    }
    .tx-action-btn:hover { color: var(--text); border-color: var(--border-light); background: var(--surface-hover); }
    .tx-action-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-backdrop);

    const ALL_CATEGORIES = [...INCOME_CATEGORIES, ...EXPENSE_CATEGORIES];
    const PAYMENT_METHODS = ['Bonifico', 'Carta di debito', 'Carta di credito', 'Contanti', 'PayPal', 'Addebito diretto'];
    const TX_STATUSES = ['Completato', 'In sospeso', 'Ricorrente'];

    const STORAGE_KEY = 'gabriele_finance_dashboard_v4';
    const LEGACY_KEY = 'gabriele_finance_dashboard_v3';
    const THEME_KEY = 'gabriele_finance_dashboard_theme';
    const fmt = (n) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n || 0);
    const fmtEUR2 = (n) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 }).format(n || 0);
    const fmtUSD = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(n || 0);
    const fmtPct = (n) => isFinite(n) ? `${(n * 100).toFixed(1)}%` : '0.0%';
    const fmtPct2 = (n) => isFinite(n) ? `${(n * 100).toFixed(2)}%` : '0.00%';

    /* ── Movimenti: calcoli (puri, riutilizzabili, testabili) ── */
    const txSum = (list) => (list || []).reduce((s, t) => s + Math.abs(Number(t.amount) || 0), 0);
    function txTotals(list) {
      const inc = (list || []).filter(t => t.type === 'income');
      const exp = (list || []).filter(t => t.type === 'expense');
      const totalIncome = txSum(inc);
      const totalExpenses = txSum(exp);
      return { totalIncome, totalExpenses, netBalance: totalIncome - totalExpenses };
    }
    function monthlyTotals(list) {
      const map = {};
      (list || []).forEach(t => {
        const key = (t.date || '').slice(0, 7);
        if (!key) return;
        if (!map[key]) map[key] = { income: 0, expenses: 0, net: 0 };
        const amt = Math.abs(Number(t.amount) || 0);
        if (t.type === 'income') map[key].income += amt; else map[key].expenses += amt;
        map[key].net = map[key].income - map[key].expenses;
      });
      return map;
    }
    const savingsRate = (income, expenses) => (income > 0 ? (income - expenses) / income : 0);
    function filterTransactions(list, f) {
      f = f || {};
      const q = (f.query || '').trim().toLowerCase();
      return (list || []).filter(t => {
        if (f.type && f.type !== 'all' && t.type !== f.type) return false;
        if (f.category && f.category !== 'all' && t.category !== f.category) return false;
        if (f.from && (t.date || '') < f.from) return false;
        if (f.to && (t.date || '') > f.to) return false;
        if (q) {
          const hay = `${t.description || ''} ${t.notes || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }
    function sortTransactions(list, key, dir) {
      const arr = [...(list || [])];
      const sign = dir === 'asc' ? 1 : -1;
      arr.sort((a, b) => {
        let av, bv;
        if (key === 'amount') { av = Math.abs(Number(a.amount) || 0); bv = Math.abs(Number(b.amount) || 0); }
        else { av = (a[key] ?? '').toString().toLowerCase(); bv = (b[key] ?? '').toString().toLowerCase(); }
        if (av < bv) return -1 * sign;
        if (av > bv) return 1 * sign;
        return 0;
      });
      return arr;
    }

    /* ── Mutui: calcoli (ammortamento alla francese) ── */
    function monthlyPayment(P, annualRatePct, years) {
      P = Number(P) || 0; const n = (Number(years) || 0) * 12;
      if (n <= 0) return 0;
      const i = (Number(annualRatePct) || 0) / 100 / 12;
      if (i === 0) return P / n;
      return P * i / (1 - Math.pow(1 + i, -n));
    }
    function amortizationSchedule(P, annualRatePct, years) {
      P = Number(P) || 0; const n = (Number(years) || 0) * 12;
      const i = (Number(annualRatePct) || 0) / 100 / 12;
      const pay = monthlyPayment(P, annualRatePct, years);
      const rows = []; let balance = P; let cumInterest = 0;
      for (let m = 1; m <= n; m++) {
        const interest = balance * i;
        let principal = pay - interest;
        if (m === n || principal > balance) principal = balance;
        balance = Math.max(0, balance - principal);
        cumInterest += interest;
        rows.push({ month: m, year: Math.ceil(m / 12), payment: pay, interest, principal, balance, cumInterest });
      }
      return rows;
    }
    // TAEG indicativo: tasso che annulla il VAN includendo spese una tantum e polizza mensile.
    function effectiveAPR(P, annualRatePct, years, feesUpfront, insuranceMonthly) {
      P = Number(P) || 0; const n = (Number(years) || 0) * 12;
      if (P <= 0 || n <= 0) return 0;
      const pay = monthlyPayment(P, annualRatePct, years) + (Number(insuranceMonthly) || 0);
      const net = P - (Number(feesUpfront) || 0); // erogato effettivo al cliente
      const npv = (r) => { let v = -net; for (let m = 1; m <= n; m++) v += pay / Math.pow(1 + r, m); return v; };
      let lo = 0, hi = 1; // tasso mensile
      if (npv(lo) * npv(hi) > 0) return Math.pow(1 + (Number(annualRatePct) || 0) / 100 / 12, 12) - 1;
      for (let k = 0; k < 80; k++) { const mid = (lo + hi) / 2; if (npv(lo) * npv(mid) <= 0) hi = mid; else lo = mid; }
      const rMonthly = (lo + hi) / 2;
      return Math.pow(1 + rMonthly, 12) - 1;
    }

    // Converte "Aprile 2026" → "2026-04", "Gennaio 2026" → "2026-01", ecc.

    /* ── Parser cedolini / estratti conto ── */
    function meseItToNum(name) {
      const idx = MESI_IT.indexOf(String(name || '').toLowerCase());
      return idx === -1 ? null : String(idx + 1).padStart(2, '0');
    }

    function parseItalianAmount(str) {
      if (!str) return null;
      let s = String(str).trim().replace(/[€\s]/g, '');
      const hasComma = s.includes(','); const hasDot = s.includes('.');
      if (hasComma && hasDot) { s = s.replace(/\./g, '').replace(',', '.'); }
      else if (hasComma) { s = s.replace(',', '.'); }
      else if (hasDot && /\.\d{3}(\D|$)/.test(s) && !/\.\d{1,2}$/.test(s)) { s = s.replace(/\./g, ''); }
      const n = parseFloat(s);
      return isFinite(n) ? n : null;
    }

    function parseFinancialDoc(text) {
      const result = { month: null, netto: null, candidates: [] };
      if (!text) return result;
      const lower = text.toLowerCase();

      // Mese: "gennaio 2024", "01/2024", "01-2024", "2024-01"
      const reMese1 = new RegExp('\\b(' + MESI_IT.join('|') + ')\\s+(20\\d{2})\\b', 'i');
      const m1 = lower.match(reMese1);
      if (m1) {
        const mm = meseItToNum(m1[1]);
        if (mm) result.month = m1[2] + '-' + mm;
      }
      if (!result.month) {
        const m2 = text.match(/\b(0[1-9]|1[0-2])[\/\-](20\d{2})\b/);
        if (m2) result.month = m2[2] + '-' + m2[1];
        else {
          const m3 = text.match(/\b(20\d{2})[\/\-](0[1-9]|1[0-2])\b/);
          if (m3) result.month = m3[1] + '-' + m3[2];
        }
      }

      // Netto: cerca parole chiave seguite da numero
      const keywords = [
        'netto a pagare', 'netto del mese', 'totale netto',
        'totale competenze nette', 'totale a pagare', 'importo netto',
        'netto in busta', 'netto bonifico'
      ];
      const numPattern = '([0-9]{1,3}(?:[\\.\\s][0-9]{3})*(?:,[0-9]{2})?|[0-9]+(?:,[0-9]{2})?|[0-9]+\\.[0-9]{2})';
      for (const kw of keywords) {
        const re = new RegExp(kw.replace(/\s+/g, '\\s+') + '[\\s:€]*' + numPattern, 'i');
        const m = lower.match(re);
        if (m) {
          const val = parseItalianAmount(m[1]);
          if (val && val > 100 && val < 100000) {
            result.candidates.push({ keyword: kw, value: val });
            if (result.netto === null) result.netto = val;
          }
        }
      }
      if (result.netto === null) {
        // Fallback: il più grande importo del documento (euristica)
        const allNums = [...lower.matchAll(/([0-9]{1,3}(?:[\.\s][0-9]{3})+,[0-9]{2}|[0-9]+,[0-9]{2})/g)]
          .map(x => parseItalianAmount(x[1])).filter(v => v && v > 500 && v < 20000);
        if (allNums.length) result.netto = Math.max(...allNums);
      }
      return result;
    }

    async function extractTextFromFile(file, onProgress) {
      const name = (file.name || '').toLowerCase();
      const isPdf = name.endsWith('.pdf') || file.type === 'application/pdf';
      if (isPdf) {
        if (!window.pdfjsLib) throw new Error('PDF.js non disponibile');
        const buf = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
        let full = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          if (onProgress) onProgress(`Lettura pagina ${i}/${pdf.numPages}...`);
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          full += content.items.map(it => it.str).join(' ') + '\n';
        }
        if (full.replace(/\s/g, '').length < 30) {
          // PDF probabilmente scansionato → fallback OCR sulla prima pagina
          if (onProgress) onProgress('PDF scansionato, eseguo OCR...');
          if (window.Tesseract) {
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 2 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            const { data } = await window.Tesseract.recognize(canvas, 'ita');
            full = data.text || '';
          }
        }
        return full;
      }
      // Immagini → OCR
      if (file.type.startsWith('image/')) {
        if (!window.Tesseract) throw new Error('Tesseract.js non disponibile');
        if (onProgress) onProgress('OCR immagine in corso...');
        const { data } = await window.Tesseract.recognize(file, 'ita', {
          logger: m => { if (m.status === 'recognizing text' && onProgress) onProgress(`OCR ${Math.round(m.progress * 100)}%`); }
        });
        return data.text || '';
      }
      throw new Error('Formato file non supportato');
    }

    /* ── Parser estratti conto → movimenti ── */
    function parseStatementDate(s) {
      if (!s) return null;
      s = String(s).trim().replace(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/, (_, y, m, d) => `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`);
      let m = s.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/);
      if (m) { let y = m[3]; if (y.length === 2) y = '20' + y; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
      m = s.match(/\b(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      return null;
    }

    function parseCSVRows(text) {
      const sample = (text.split(/\r?\n/).find(l => l.trim()) || '');
      const delim = (sample.split(';').length > sample.split(',').length) ? ';' : ',';
      const rows = []; let row = [], field = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
          else field += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === delim) { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c === '\r') { /* skip */ }
          else field += c;
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows.map(r => r.map(x => String(x).trim())).filter(r => r.some(x => x.length));
    }

    function parseStatementCSV(text) {
      if (!text) return [];
      const rows = parseCSVRows(text);
      if (!rows.length) return [];
      // Trova la riga di intestazione
      let headerIdx = -1;
      for (let i = 0; i < Math.min(rows.length, 20); i++) {
        const joined = rows[i].join(' ').toLowerCase();
        if (/\bdata\b/.test(joined) && /(importo|amount|dare|avere|entrate|uscite|accredit|addebit|valore)/.test(joined)) { headerIdx = i; break; }
      }
      if (headerIdx === -1) return [];
      const header = rows[headerIdx].map(h => h.toLowerCase());
      const findCol = (...res) => header.findIndex(h => res.some(re => re.test(h)));
      const dateIdx = (() => {
        const pref = header.findIndex(h => /data.*(valuta|oper|contab)/.test(h));
        return pref !== -1 ? pref : findCol(/\bdata\b/);
      })();
      const descIdx = findCol(/descriz|causale|operazione|dettagl|note/);
      const amtIdx = findCol(/^importo|importo$|^amount|valore/);
      const dareIdx = findCol(/dare|uscit|addebit/);
      const avereIdx = findCol(/avere|entrat|accredit/);
      if (dateIdx === -1 || (amtIdx === -1 && dareIdx === -1 && avereIdx === -1)) return [];
      const out = [];
      for (let i = headerIdx + 1; i < rows.length; i++) {
        const r = rows[i];
        const date = parseStatementDate(r[dateIdx]);
        if (!date) continue;
        let amount = null, type = null;
        if (amtIdx !== -1 && r[amtIdx]) {
          const raw = parseItalianAmount(r[amtIdx]);
          if (raw === null || raw === 0) continue;
          amount = Math.abs(raw); type = raw < 0 ? 'expense' : 'income';
        } else {
          const d = dareIdx !== -1 ? parseItalianAmount(r[dareIdx]) : null;
          const a = avereIdx !== -1 ? parseItalianAmount(r[avereIdx]) : null;
          if (a) { amount = Math.abs(a); type = 'income'; }
          else if (d) { amount = Math.abs(d); type = 'expense'; }
          else continue;
        }
        const description = (descIdx !== -1 ? (r[descIdx] || '') : '').replace(/\s+/g, ' ').trim();
        out.push({ date, description: description || 'Movimento', amount, type });
      }
      return out;
    }

    function parseStatementText(text) {
      if (!text) return [];
      const t = text.replace(/\r/g, ' ').replace(/[ \t]+/g, ' ');
      const dateRe = /\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b/g;
      const dates = [...t.matchAll(dateRe)];
      const amtRe = /([-+])?\s?(\d{1,3}(?:[.\s]\d{3})*,\d{2})\s?([-+])?/g;
      const out = [];
      for (let i = 0; i < dates.length; i++) {
        const start = dates[i].index;
        const end = (i + 1 < dates.length) ? dates[i + 1].index : Math.min(t.length, start + 400);
        const seg = t.slice(start, end);
        const dateM = seg.match(/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/);
        if (!dateM) continue;
        const date = parseStatementDate(dateM[0]);
        if (!date) continue;
        amtRe.lastIndex = 0;
        let am, last = null;
        while ((am = amtRe.exec(seg)) !== null) { if (am.index >= dateM[0].length) last = am; }
        if (!last) continue;
        const num = parseItalianAmount(last[2]);
        if (!num || num <= 0) continue;
        const sign = (last[1] === '-' || last[3] === '-') ? -1 : 1;
        let desc = seg.slice(dateM[0].length, last.index)
          .replace(/^\s*\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\s*/, '') // eventuale seconda data (valuta)
          .replace(/\s+/g, ' ').trim();
        const clean = desc.replace(/saldo|riporto|totale|pagina|estratto conto|disponibilit[aà]/ig, '').trim();
        if (!clean && desc) continue; // riga di saldo/totale
        out.push({ date, description: desc || 'Movimento', amount: num, type: sign < 0 ? 'expense' : 'income' });
      }
      return out;
    }

    const TX_CATEGORY_RULES = [
      // — Uscite —
      [/esselunga|conad|coop\b|carrefour|lidl|eurospin|\bpam\b|despar|supermerc|\bmd\b|\baldi\b|alimentari|macelleria|panetteria|ortofrutta/i, 'Spesa alimentare', 'expense'],
      [/affitto|canone\s+locazione|locazione/i, 'Affitto / Mutuo', 'expense'],
      [/mutuo|rata\s+mutuo/i, 'Affitto / Mutuo', 'expense'],
      [/enel|a2a|hera\b|iren\b|acea|edison|eni\s*gas|sorgenia|illumia|servizio\s+elettrico|metano|acquedot|bolletta|\bgas\b|fornitura/i, 'Bollette', 'expense'],
      [/\btim\b|vodafone|wind\s?tre|windtre|iliad|fastweb|telecom|fibra|adsl|internet|sky\s*wifi/i, 'Bollette', 'expense'],
      [/netflix|spotify|disney|prime\s*video|amazon\s*prime|now\s*tv|\bdazn\b|youtube\s*premium|icloud|google\s*one|dropbox|abbonamento|canone\s*mensile/i, 'Abbonamenti', 'expense'],
      [/trenitalia|\bitalo\b|\batac\b|\bgtt\b|\bamt\b|atm\s*milano|autostrad|telepass|carburant|benzina|\bq8\b|\beni\b|\besso\b|tamoil|\bip\b\s*gas|distributore|parchegg|\btaxi\b|\buber\b|\bbus\b|biglietto\s*treno|abbonamento\s*(bus|treno|metro)/i, 'Trasporti', 'expense'],
      [/farmacia|parafarmac|dott\.|medico|dentist|odontoiatr|ospedale|\basl\b|analisi\s*clinic|laboratorio\s*analisi|\bottica\b|visita\s*medica|fisioterap/i, 'Salute', 'expense'],
      [/universit|tasse\s*univ|libreria|\bcorso\b|iscrizione|\bscuola\b|\besame\b|udemy|coursera|formazione/i, 'Istruzione', 'expense'],
      [/ristorante|pizzeria|trattoria|osteria|\bbar\b|caff[eè]|mcdonald|burger\s*king|kfc|deliveroo|just\s?eat|glovo|\bcinema\b|teatro|concerto|museo|palestra|\bgym\b/i, 'Svago', 'expense'],
      [/zalando|\bzara\b|h&m|\bhm\b|amazon(?!\s*prime)|\bebay\b|decathlon|\bikea\b|mediaworld|unieuro|euronics|apple\s*store|\bnike\b|adidas|leroy\s*merlin|brico|negozio|acquisto\s*pos/i, 'Shopping', 'expense'],
      [/\bf24\b|agenzia\s*entrate|\bimu\b|\btari\b|\btasi\b|bollo\s*auto|canone\s*rai|imposta|tributo|\btassa\b|\biva\b\s*trimestr|inps|inail/i, 'Tasse', 'expense'],
      // — Entrate —
      [/stipendio|emolument|retribuzione|cedolino|busta\s*paga|accredito\s*stipendio|\bnetto\b\s*bonifico/i, 'Stipendio', 'income'],
      [/fattura|compenso|prestazione|parcella|freelance|\bp\.?\s?iva\b|onorario|collaborazione/i, 'Freelance', 'income'],
      [/dividend|\bcedola\b|interess(i|e)\s*attiv|rendiment|plusvalenz|affitto\s*attivo|locazione\s*attiva/i, 'Entrate passive', 'income'],
      [/rimborso|\bstorno\b|\breso\b|cashback/i, 'Rimborsi', 'income'],
      [/disinvestiment|vendita\s*titoli|riscatto|liquidazione\s*fondo|prelievo\s*da\s*deposito/i, 'Investimenti', 'income'],
    ];
    function guessTxCategory(desc, type) {
      const d = String(desc || '');
      for (const [re, cat, t] of TX_CATEGORY_RULES) { if (t === type && re.test(d)) return cat; }
      return type === 'income' ? 'Altre entrate' : 'Altre uscite';
    }
    function guessPaymentMethod(desc) {
      const d = String(desc || '').toLowerCase();
      if (/paypal/.test(d)) return 'PayPal';
      if (/prelievo|\batm\b|sportello|contant/.test(d)) return 'Contanti';
      if (/\bpos\b|pagamento\s*pos|carta\s*di\s*debito|bancomat/.test(d)) return 'Carta di debito';
      if (/carta\s*di\s*credito|\bcredit\b|revolving|\bcc\b\s/.test(d)) return 'Carta di credito';
      if (/\bsdd\b|rid\b|addebito\s*(diretto|sdd|preautorizzato)|domiciliazione/.test(d)) return 'Addebito diretto';
      if (/bonifico|giroconto|\bsepa\b|\bf24\b|mav|rav|bollettino/.test(d)) return 'Bonifico';
      return 'Bonifico';
    }
    function isDuplicateTx(tx, existing) {
      const amt = Math.abs(Number(tx.amount) || 0);
      const desc = String(tx.description || '').slice(0, 24).toLowerCase().trim();
      return (existing || []).some(e =>
        e.date === tx.date &&
        Math.abs(Math.abs(Number(e.amount) || 0) - amt) < 0.005 &&
        String(e.description || '').slice(0, 24).toLowerCase().trim() === desc
      );
    }

    /* ── Cedolini Tab ── */
    function CedoliniTab({ cedolini, onAdd, onRemove, currentISO, showToast }) {

      const confirmImport = () => {
        if (!confirmData) return;

        showToast && showToast('Cedolino importato dal documento');

      const sorted = [...cedolini].sort((a, b) => a.month.localeCompare(b.month));

      const handleAdd = () => {
        if (!form.month.match(/^\d{4}-\d{2}$/)) { setErr('Formato mese non valido (YYYY-MM)'); return; }

        if (!nettoNum || nettoNum <= 0) { setErr('Inserisci un netto valido'); return; }
        if (cedolini.find(c => c.month === form.month)) { setErr('Cedolino già presente per questo mese'); return; }

        setForm(f => ({ ...f, netto: '', note: '' }));

      const chartData = sorted.map(c => ({ month: c.month, netto: c.netto }));

            </h3>
            <div
              onDragOver={e => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={onDrop}
              onClick={() => fileInputRef.current && fileInputRef.current.click()}
              style={{
                border: `2px dashed ${isDragging ? C.gold : C.borderLight}`,
                background: isDragging ? 'var(--accent-subtle)' : 'var(--surface-soft)',
                borderRadius: 8, padding: '32px 20px', textAlign: 'center',
                cursor: loading ? 'wait' : 'pointer', transition: 'all 0.2s',
                opacity: loading ? 0.7 : 1
              }}>
              <input ref={fileInputRef} type="file" accept="application/pdf,image/*"
                style={{ display: 'none' }}
                onChange={e => { const f = e.target.files[0]; if (f) handleFileUpload(f); e.target.value = ''; }} />
              {loading ? (
                <div>
                  <div style={{ fontSize: 28, marginBottom: 10 }}>⏳</div>

                <div>
                  <div style={{ fontSize: 28, marginBottom: 10, color: C.gold }}>⤓</div>

                  </div>

                    oppure clicca per selezionare · supportati PDF e immagini (OCR)
                  </div>

            </div>

            {confirmData && (
              <div style={{ marginTop: 16, padding: 16, border: `1px solid ${C.gold}`, borderRadius: 6, background: 'var(--accent-subtle)' }}>

                  <button onClick={() => setConfirmData(null)}

                {confirmData.candidates && confirmData.candidates.length > 0 && (

          </div>

          {/* Form aggiunta */}
          <div className="bento-card span-12">

              <span><span className="diamond">◆</span><span style={{ fontStyle: 'italic' }}>Inserisci cedolino</span></span>

            <div style={{ display: 'grid', gridTemplateColumns: '160px 180px 1fr auto', gap: 16, alignItems: 'end' }}>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Mese (YYYY-MM)</label>
                <input
                  className="input-cell"
                  placeholder="2026-04"
                  value={form.month}
                  onChange={e => setForm(f => ({ ...f, month: e.target.value }))}
                />
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Netto a pagare (€)</label>
                <input
                  type="number"
                  className="input-cell"
                  placeholder="1550"
                  value={form.netto}
                  onChange={e => setForm(f => ({ ...f, netto: e.target.value }))}

                />
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Note (opzionale)</label>
                <input

              <button

                + Aggiungi

            </div>
            {err && <div style={{ marginTop: 10, fontSize: 12, color: C.danger }}>{err}</div>}

          {/* Chart trend netto */}
          {sorted.length > 1 && (
            <div className="bento-card span-12">
              <h3 className="card-title">
                <span><span className="diamond">◆</span><span style={{ fontStyle: 'italic' }}>Trend netto mensile</span></span>

                      {['Mese', 'Netto', 'Δ mese prec.', 'Stato', 'Note', ''].map(h => (
                        <th key={h} style={{ textAlign: 'left', padding: '10px 8px', fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.15em', color: C.textMuted, fontWeight: 500 }}>{h}</th>
                      ))}

                              onClick={() => onRemove(c.id)}

          </div>

          {/* KPI summary */}
          {sorted.length > 0 && (
            <div className="bento-card span-4">
              <div className="card-eyebrow">Media netto</div>
              <div className="kpi-value" style={{ color: C.gold }}>{fmt(avg)}</div>
              <div className="kpi-sub">{sorted.length} mesi registrati</div>
            </div>
          )}
          {sorted.length > 0 && (
            <div className="bento-card span-4 accent-rust">
              <div className="card-eyebrow">Netto minimo</div>
              <div className="kpi-value" style={{ color: C.rust }}>{fmt(Math.min(...sorted.map(c => c.netto)))}</div>
              <div className="kpi-sub">{sorted.reduce((m, c) => c.netto < m.netto ? c : m).month}</div>
            </div>
          )}
          {sorted.length > 0 && (
            <div className="bento-card span-4 accent-sage">
              <div className="card-eyebrow">Netto massimo</div>
              <div className="kpi-value" style={{ color: C.sage }}>{fmt(Math.max(...sorted.map(c => c.netto)))}</div>
              <div className="kpi-sub">{sorted.reduce((m, c) => c.netto > m.netto ? c : m).month}</div>
            </div>
          )}
        </div>
      );
    }

    /* ── Investment helpers ── */
    const TYPE_COLORS = { Equity: C.gold, Cripto: C.rust, Pensione: C.purple, Bond: C.teal, Liquidita: C.textDim };

    function pacMontante(pmt, annualNet, years) {
      const n = years * 12;
      const r = Math.pow(1 + annualNet, 1 / 12) - 1;
      if (r === 0) return pmt * n;
      return pmt * ((Math.pow(1 + r, n) - 1) / r);
    }

    function monthsUntil(dateStr) {
      const now = new Date();
      const target = new Date(dateStr);
      const diffDays = (target - now) / (1000 * 60 * 60 * 24);
      return Math.max(0, Math.round(diffDays / 30.44));
    }

    /* ── Investments Tab ── */
    function InvestmentsTab({ data, totals, onUpdateField, onAddItem, onRemoveItem, onUpdateTarget }) {
      const investments = data.investments;

      const totalInvested = totals.totalInvestCurrent;
      const totalEntry = investments.reduce((s, i) => s + Number(i.entryValue || 0), 0);
      const weighted = investments.reduce((acc, i) => {
        const ev = Number(i.entryValue || 0);
        const cv = Number(i.current || 0);
        if (ev > 0 && cv > 0) {
          acc.num += cv * ((cv - ev) / ev);
          acc.den += cv;
        }
        return acc;
      }, { num: 0, den: 0 });
      const roiPct = weighted.den > 0 ? (weighted.num / weighted.den) * 100 : 0;

      const allocMap = investments.reduce((acc, i) => {
        const t = i.type || 'Equity';
        acc[t] = (acc[t] || 0) + Number(i.current || 0);
        return acc;
      }, {});
      const allocPie = Object.entries(allocMap).map(([name, value]) => ({ name, value }));
      const target = data.investmentsMeta.targetAllocation;
      const categories = Array.from(new Set([...Object.keys(target), ...Object.keys(allocMap)]));
      const allocBars = categories.map(cat => ({
        name: cat,
        Attuale: totalInvested > 0 ? +((allocMap[cat] || 0) / totalInvested * 100).toFixed(1) : 0,
        Target: Number(target[cat] || 0)
      }));

      const pipMonthly = 250;
      const pipYears = 36;
      const finA = pacMontante(pipMonthly, 0.0307, pipYears);
      const finB = pacMontante(pipMonthly, 0.0580, pipYears);
      const costOpportunity = finB - finA;

      const roadmapMonths = monthsUntil('2026-09-09');

      const ttStyle = { contentStyle: { background: C.bg, border: `1px solid ${C.gold}`, fontFamily: 'var(--font-number)', fontSize: 12, color: C.text, borderRadius: 4 }, itemStyle: { color: C.textDim }, labelStyle: { color: C.gold } };

      return (
        <div className="bento">

          {/* KPI row */}
          <div className="bento-card span-3">
            <div className="card-eyebrow">Patrimonio investito</div>
            <div className="kpi-value" style={{ color: C.gold }}>{fmt(totalInvested)}</div>

    /* ── Sentiment Panel ── */
    function SentimentPanel({ onPrefill }) {
      const [fng, setFng] = React.useState({ data: null, error: null, loading: true });
      const [poly, setPoly] = React.useState({ data: null, error: null, loading: true });

      React.useEffect(() => {
        const ctrl = new AbortController();
        fetch('https://api.alternative.me/fng/?limit=7', { signal: ctrl.signal })
          .then(r => r.ok ? r.json() : Promise.reject('http'))
          .then(j => {
            const arr = (j.data || []).slice().reverse().map(d => ({
              date: new Date(Number(d.timestamp) * 1000).toISOString().slice(5, 10),
              value: Number(d.value),
              classification: d.value_classification
            }));
            setFng({ data: arr, error: null, loading: false });
          })
          .catch(e => {
            if (e.name !== 'AbortError') setFng({ data: null, error: true, loading: false });
          });
        return () => ctrl.abort();
      }, []);

      React.useEffect(() => {
        const ctrl = new AbortController();
        fetch('https://gamma-api.polymarket.com/markets?limit=10&active=true&closed=false', { signal: ctrl.signal })
          .then(r => r.ok ? r.json() : Promise.reject('http'))
          .then(j => {
            const list = (Array.isArray(j) ? j : (j.data || [])).slice(0, 10).map(m => {
              let yes = null;
              try {
                const prices = typeof m.outcomePrices === 'string' ? JSON.parse(m.outcomePrices) : m.outcomePrices;
                if (Array.isArray(prices) && prices.length > 0) yes = Number(prices[0]);
              } catch { }
              return { id: m.id || m.conditionId, question: m.question || m.slug, yes, volume: m.volume ? Number(m.volume) : null, endDate: m.endDate || m.end_date_iso || '' };
            });
            setPoly({ data: list, error: null, loading: false });
          })
          .catch(e => {
            if (e.name !== 'AbortError') setPoly({ data: null, error: true, loading: false });
          });
        return () => ctrl.abort();
      }, []);

      const fngCurrent = fng.data && fng.data.length > 0 ? fng.data[fng.data.length - 1] : null;
      const fngColor = (v) => v <= 25 ? C.danger : v <= 45 ? C.rust : v <= 55 ? C.gold : v <= 75 ? '#a0c774' : C.sage;
      const fngLabel = (v) => v <= 25 ? 'Extreme Fear' : v <= 45 ? 'Fear' : v <= 55 ? 'Neutral' : v <= 75 ? 'Greed' : 'Extreme Greed';

      const ttStyle = { contentStyle: { background: C.bg, border: `1px solid ${C.gold}`, fontFamily: 'var(--font-number)', fontSize: 12, color: C.text, borderRadius: 4 }, itemStyle: { color: C.textDim }, labelStyle: { color: C.gold } };

      return (
        <div className="bento-card span-12">
          <h3 className="card-title"><span><span className="diamond">◆</span><span style={{ fontStyle: 'italic' }}>Sentiment & feed live</span></span></h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 20 }}>

            {/* Fear & Greed */}
            <div>
              <div className="card-eyebrow" style={{ marginBottom: 12 }}>Crypto Fear & Greed (alternative.me)</div>
              {fng.loading && <div style={{ color: C.textMuted, fontSize: 12 }}>Caricamento…</div>}
              {fng.error && <div style={{ color: C.rust, fontSize: 12, fontStyle: 'italic' }}>Dati non disponibili offline.</div>}
              {fngCurrent && (
                <>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 20, marginBottom: 14 }}>
                    <RadialGauge value={fngCurrent.value} max={100} label={fngCurrent.value} sub={fngLabel(fngCurrent.value).toUpperCase()} color={fngColor(fngCurrent.value)} size={140} />
                  </div>
                  <ResponsiveContainer width="100%" height={120}>
                    <LineChart data={fng.data}>
                      <CartesianGrid strokeDasharray="2 4" stroke={C.border} />
                      <XAxis dataKey="date" stroke={C.textMuted} tick={{ fontSize: 10 }} />
                      <YAxis stroke={C.textMuted} domain={[0, 100]} tick={{ fontSize: 10 }} />
                      <Tooltip {...ttStyle} />
                      <Line type="monotone" dataKey="value" stroke={C.gold} strokeWidth={2} dot={{ r: 3, fill: C.gold }} />
                    </LineChart>
                  </ResponsiveContainer>
                </>
              )}
            </div>

            {/* Polymarket top */}
            <div>
              <div className="card-eyebrow" style={{ marginBottom: 12 }}>Top 10 mercati Polymarket</div>
              {poly.loading && <div style={{ color: C.textMuted, fontSize: 12 }}>Caricamento…</div>}
              {poly.error && <div style={{ color: C.rust, fontSize: 12, fontStyle: 'italic' }}>Feed non disponibile. Inserisci posizioni manualmente.</div>}
              {poly.data && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: 380, overflowY: 'auto' }}>
                  {poly.data.length === 0 && <div style={{ color: C.textMuted, fontSize: 12 }}>Nessun mercato attivo.</div>}
                  {poly.data.map((m, i) => {
                    const yesPct = m.yes != null ? (m.yes <= 1 ? m.yes * 100 : m.yes) : null;
                    return (
                      <div key={m.id || i} style={{ border: `1px solid ${C.border}`, padding: 10, borderRadius: 6, display: 'flex', gap: 10, alignItems: 'center', justifyContent: 'space-between' }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 12, color: C.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.question}</div>
                          <div className="mono-font" style={{ fontSize: 10, color: C.textMuted, marginTop: 3 }}>
                            {yesPct != null ? `YES ${yesPct.toFixed(1)}%` : 'YES n/d'}
                            {m.volume != null ? ` · vol ${(m.volume / 1000).toFixed(1)}k` : ''}
                          </div>
                        </div>
                        <button
                          onClick={() => onPrefill({ market: m.question, outcome: 'YES', currency: 'USDC', entryProb: yesPct != null ? Math.max(1, Math.min(99, Math.round(yesPct))) : 50, currentProb: yesPct != null ? Math.max(1, Math.min(99, Math.round(yesPct))) : 50, deadline: (m.endDate || '').slice(0, 10) })}
                          style={{ background: 'transparent', border: `1px solid ${C.goldDim}`, color: C.gold, padding: '4px 8px', fontSize: 10, letterSpacing: '0.08em', cursor: 'pointer', borderRadius: 4, whiteSpace: 'nowrap' }}>
                          + Watchlist
                        </button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ── Markets Tab ── */
    function MarketsTab({ markets, onAdd, onUpdate, onRemove, onClose, onUpdateRate }) {
      const [form, setForm] = React.useState({ market: '', outcome: 'YES', currency: 'USDC', capitalRisked: '', entryProb: '', currentProb: '', deadline: '', note: '' });
      const [err, setErr] = React.useState('');
      const formRef = React.useRef(null);

      const handlePrefill = React.useCallback((p) => {
        setForm(f => ({ ...f, ...p, capitalRisked: f.capitalRisked, note: f.note }));
        setErr('');
        if (formRef.current) formRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, []);

      const handleAdd = () => {
        const cap = Number(form.capitalRisked);
        const ep = Number(form.entryProb);
        const cp = Number(form.currentProb);
        if (!form.market.trim()) { setErr('Inserisci nome mercato'); return; }
        if (!(cap > 0)) { setErr('Capitale deve essere > 0'); return; }
        if (!(ep >= 1 && ep <= 99)) { setErr('Probabilità ingresso 1-99'); return; }
        if (!(cp >= 1 && cp <= 99)) { setErr('Probabilità attuale 1-99'); return; }
        onAdd({
          market: form.market.trim(),
          outcome: form.outcome.trim() || 'YES',
          currency: form.currency,
          capitalRisked: cap,
          entryProb: ep,
          currentProb: cp,
          status: 'Aperta',
          deadline: form.deadline,
          note: form.note
        });
        setForm({ market: '', outcome: 'YES', currency: 'USDC', capitalRisked: '', entryProb: '', currentProb: '', deadline: '', note: '' });
        setErr('');
      };

      const positions = markets.polyPositions || [];
      const open = positions.filter(p => p.status === 'Aperta');
      const won = positions.filter(p => p.status === 'Vinta');
      const lost = positions.filter(p => p.status === 'Persa');

      const rate = Number(markets.eurUsdRate) || 1;
      const openEur = open.filter(p => p.currency === 'EUR').reduce((s, p) => s + Number(p.capitalRisked || 0), 0);
      const openUsd = open.filter(p => p.currency === 'USDC').reduce((s, p) => s + Number(p.capitalRisked || 0), 0);
      const openUsdInEur = openUsd / rate;
      const totalRiskEur = openEur + openUsdInEur;

      const realizedPnl = positions.reduce((s, p) => {
        if (p.status === 'Vinta') return s + p.capitalRisked * ((100 - p.entryProb) / Math.max(1, p.entryProb));
        if (p.status === 'Persa') return s - p.capitalRisked;
        return s;
      }, 0);

      const unrealizedPnl = open.reduce((s, p) => s + p.capitalRisked * ((p.currentProb - p.entryProb) / Math.max(1, p.entryProb)), 0);
      const winRate = (won.length + lost.length) > 0 ? (won.length / (won.length + lost.length)) * 100 : 0;

      const ttStyle = { contentStyle: { background: C.bg, border: `1px solid ${C.gold}`, fontFamily: 'var(--font-number)', fontSize: 12, color: C.text, borderRadius: 4 }, itemStyle: { color: C.textDim }, labelStyle: { color: C.gold } };

      return (
        <div className="bento">

          {/* Form */}
          <div className="bento-card span-12" ref={formRef}>
            <h3 className="card-title"><span><span className="diamond">◆</span><span style={{ fontStyle: 'italic' }}>Aggiungi posizione</span></span></h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 14, alignItems: 'end' }}>
              <div style={{ gridColumn: 'span 2', minWidth: 220 }}>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Mercato</label>
                <input className="input-cell" placeholder="Es. Trump wins 2028" value={form.market} onChange={e => setForm(f => ({ ...f, market: e.target.value }))} />
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Outcome</label>
                <input className="input-cell" placeholder="YES / NO" value={form.outcome} onChange={e => setForm(f => ({ ...f, outcome: e.target.value }))} />
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Valuta</label>
                <select className="input-cell" value={form.currency} onChange={e => setForm(f => ({ ...f, currency: e.target.value }))} style={{ background: C.card }}>
                  <option>USDC</option><option>EUR</option>
                </select>
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Capitale</label>
                <input type="number" className="input-cell" placeholder="100" value={form.capitalRisked} onChange={e => setForm(f => ({ ...f, capitalRisked: e.target.value }))} style={{ textAlign: 'right' }} />
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Prob. ingresso %</label>
                <input type="number" className="input-cell" placeholder="35" value={form.entryProb} onChange={e => setForm(f => ({ ...f, entryProb: e.target.value }))} style={{ textAlign: 'right' }} />
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Prob. attuale %</label>
                <input type="number" className="input-cell" placeholder="42" value={form.currentProb} onChange={e => setForm(f => ({ ...f, currentProb: e.target.value }))} style={{ textAlign: 'right' }} />
              </div>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Scadenza</label>
                <input type="date" className="input-cell" value={form.deadline} onChange={e => setForm(f => ({ ...f, deadline: e.target.value }))} />
              </div>
              <div style={{ gridColumn: 'span 2', minWidth: 220 }}>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Note</label>
                <input className="input-label" placeholder="Tesi, fonte, link…" value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} />
              </div>
              <button onClick={handleAdd} style={{ background: C.gold, border: 'none', color: C.onAccent, padding: '10px 20px', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12, fontWeight: 600, letterSpacing: '0.08em', borderRadius: 6, whiteSpace: 'nowrap', height: 42 }}>
                + Aggiungi
              </button>
            </div>
            {err && <div style={{ marginTop: 10, fontSize: 12, color: C.danger }}>{err}</div>}
          </div>

          {/* KPIs */}
          <div className="bento-card span-3">
            <div className="card-eyebrow">Capitale a rischio (aperte)</div>
            <div className="kpi-value" style={{ color: C.gold }}>{fmt(totalRiskEur)}</div>
            <div className="mono-font" style={{ fontSize: 11, color: C.textDim, marginTop: 8, lineHeight: 1.6 }}>
              EUR: {fmtEUR2(openEur)}<br />
              USDC: {fmtUSD(openUsd)}
            </div>
          </div>

          <div className="bento-card span-3 accent-sage">
            <div className="card-eyebrow">P&L realizzato</div>
            <div className="kpi-value" style={{ color: realizedPnl >= 0 ? C.sage : C.rust }}>
              {realizedPnl >= 0 ? '+' : ''}{fmtEUR2(realizedPnl)}
            </div>
            <div className="kpi-sub">{won.length} vinte · {lost.length} perse</div>
          </div>

          <div className="bento-card span-3">
            <div className="card-eyebrow">P&L non realizzato</div>
            <div className="kpi-value" style={{ color: unrealizedPnl >= 0 ? C.sage : C.rust }}>
              {unrealizedPnl >= 0 ? '+' : ''}{fmtEUR2(unrealizedPnl)}
            </div>
            <div className="kpi-sub">mark-to-market aperte</div>
          </div>

          <div className="bento-card span-3 accent-rust">
            <div className="card-eyebrow">Win rate</div>
            <div className="kpi-value" style={{ color: winRate >= 50 ? C.sage : C.rust }}>{winRate.toFixed(1)}%</div>
            <div className="kpi-sub">su {won.length + lost.length} chiuse</div>
          </div>

          {/* Positions table */}
          <div className="bento-card span-12">
            <h3 className="card-title"><span><span className="diamond">◆</span><span style={{ fontStyle: 'italic' }}>Posizioni</span></span><span className="mono-font" style={{ fontSize: 11, color: C.textMuted }}>{positions.length} totali</span></h3>
            {positions.length === 0 ? (
              <div style={{ padding: 40, textAlign: 'center', color: C.textMuted }}>
                <p>Nessuna posizione. Usa il form sopra per aggiungerne una.</p>
              </div>
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12, minWidth: 900 }}>
                  <thead>
                    <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                      {['Mercato', 'Outcome', 'Val.', 'Capitale', 'Prob. ingr', 'Prob. att', 'Δ', 'Quota', 'P&L stim', 'Scad.', 'Stato', ''].map(h => (
                        <th key={h} style={{ textAlign: 'left', padding: '8px 6px', fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.12em', color: C.textMuted, fontWeight: 500 }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {positions.map(p => {
                      const delta = p.currentProb - p.entryProb;
                      const quota = (100 / Math.max(1, p.entryProb)).toFixed(2);
                      const isOpen = p.status === 'Aperta';
                      const pnl = isOpen
                        ? p.capitalRisked * (delta / Math.max(1, p.entryProb))
                        : p.status === 'Vinta' ? p.capitalRisked * ((100 - p.entryProb) / Math.max(1, p.entryProb))
                          : p.status === 'Persa' ? -p.capitalRisked
                            : 0;
                      const rowBg = p.status === 'Vinta' ? 'rgba(107,142,111,0.10)'
                        : p.status === 'Persa' ? 'rgba(197,69,69,0.10)'
                          : (isOpen && p.currentProb > p.entryProb) ? 'var(--accent-soft)'
                            : 'transparent';
                      return (
                        <tr key={p.id} className="data-row" style={{ borderBottom: `1px solid ${C.border}`, background: rowBg }}>
                          <td style={{ padding: '8px 6px', maxWidth: 220, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: C.text }}>{p.market}</td>
                          <td className="mono-font" style={{ padding: '8px 6px', color: C.textDim }}>{p.outcome}</td>
                          <td className="mono-font" style={{ padding: '8px 6px', color: C.textDim }}>{p.currency}</td>
                          <td className="mono-font" style={{ padding: '8px 6px', color: C.gold }}>{p.currency === 'USDC' ? fmtUSD(p.capitalRisked) : fmtEUR2(p.capitalRisked)}</td>
                          <td className="mono-font" style={{ padding: '8px 6px' }}>{p.entryProb}%</td>
                          <td style={{ padding: '4px 6px', width: 70 }}>
                            <input type="number" className="input-cell mono-font" value={p.currentProb} onChange={e => onUpdate(p.id, 'currentProb', e.target.value)} style={{ fontSize: 12, padding: '4px 2px', textAlign: 'right' }} />
                          </td>
                          <td className="mono-font" style={{ padding: '8px 6px', color: delta >= 0 ? C.sage : C.rust }}>{delta >= 0 ? '+' : ''}{delta.toFixed(0)}</td>
                          <td className="mono-font" style={{ padding: '8px 6px', color: C.textDim }}>{quota}x</td>
                          <td className="mono-font" style={{ padding: '8px 6px', color: pnl >= 0 ? C.sage : C.rust }}>{pnl >= 0 ? '+' : ''}{p.currency === 'USDC' ? fmtUSD(pnl) : fmtEUR2(pnl)}</td>
                          <td className="mono-font" style={{ padding: '8px 6px', color: C.textMuted, fontSize: 11 }}>{p.deadline || '—'}</td>
                          <td style={{ padding: '4px 6px' }}>
                            <select value={p.status} onChange={e => onClose(p.id, e.target.value)} className="input-cell" style={{ background: C.card, fontSize: 11, padding: '4px 2px' }}>
                              <option>Aperta</option><option>Chiusa</option><option>Vinta</option><option>Persa</option>
                            </select>
                          </td>
                          <td style={{ padding: '8px 6px' }}>
                            <button onClick={() => onRemove(p.id)} style={{ background: 'none', border: 'none', color: C.danger, cursor: 'pointer', opacity: 0.6 }}><Ic.trash /></button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* Kelly panel */}
          <div className="bento-card span-6">
            <h3 className="card-title"><span><span className="diamond">◆</span><span style={{ fontStyle: 'italic' }}>Kelly Criterion (posizioni aperte)</span></span></h3>
            {open.length === 0 ? (
              <div style={{ color: C.textMuted, fontSize: 12, padding: 20, textAlign: 'center' }}>Nessuna posizione aperta.</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {open.map(p => {
                  const ep = p.entryProb;
                  const cp = p.currentProb;
                  const b = (100 / ep) - 1;
                  const pp = cp / 100;
                  const q = 1 - pp;
                  const f = b > 0 ? (b * pp - q) / b : -1;
                  return (
                    <div key={p.id} style={{ border: `1px solid ${C.border}`, borderRadius: 6, padding: 10 }}>
                      <div style={{ fontSize: 12, color: C.text, marginBottom: 6, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.market}</div>
                      {f <= 0 ? (
                        <div className="mono-font" style={{ fontSize: 11, color: C.rust }}>Non scommettere (EV negativo)</div>
                      ) : (
                        <div className="mono-font" style={{ fontSize: 11, color: C.sage }}>
                          Kelly: {(f * 100).toFixed(1)}% del bankroll · Half-Kelly: {(f * 50).toFixed(1)}%
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
            <p style={{ marginTop: 12, fontSize: 11, color: C.textMuted, fontStyle: 'italic', lineHeight: 1.5 }}>
              Kelly indica la dimensione ottimale teorica della posizione per massimizzare la crescita del bankroll nel lungo periodo. Valori alti vanno dimezzati (Half-Kelly) per prudenza.
            </p>
          </div>

          {/* P&L chart */}
          <div className="bento-card span-6">
            <h3 className="card-title"><span><span className="diamond">◆</span><span style={{ fontStyle: 'italic' }}>P&L realizzato cumulativo</span></span></h3>
            {(!markets.pnlHistory || markets.pnlHistory.length === 0) ? (
              <div style={{ padding: 40, textAlign: 'center', color: C.textMuted, fontSize: 12 }}>Chiudi le prime posizioni per vedere il grafico.</div>
            ) : (
              <ResponsiveContainer width="100%" height={240}>
                <LineChart data={markets.pnlHistory}>
                  <CartesianGrid strokeDasharray="2 4" stroke={C.border} />
                  <XAxis dataKey="date" stroke={C.textMuted} tick={{ fontSize: 11 }} />
                  <YAxis stroke={C.textMuted} tick={{ fontSize: 11 }} />
                  <Tooltip {...ttStyle} formatter={(v) => fmtEUR2(v)} />
                  <Line type="monotone" dataKey="pnl" stroke={C.gold} strokeWidth={2.5} dot={{ r: 4, fill: C.gold }} />
                </LineChart>
              </ResponsiveContainer>
            )}
          </div>

          {/* Sentiment */}
          <SentimentPanel onPrefill={handlePrefill} />

          {/* EUR/USD */}
          <div className="bento-card span-12">
            <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
              <div>
                <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.15em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Tasso EUR/USD</label>
                <input type="number" step="0.0001" className="input-cell mono-font" value={markets.eurUsdRate} onChange={e => onUpdateRate(e.target.value)} style={{ width: 160, textAlign: 'right' }} />
              </div>
              <div style={{ fontSize: 11, color: C.textMuted, fontStyle: 'italic', flex: 1, minWidth: 220 }}>
                Usato per convertire le posizioni USDC in EUR nei KPI. 1 EUR = {Number(markets.eurUsdRate).toFixed(4)} USD.
              </div>
            </div>
          </div>

        </div>
      );
    }

    /* ══════════ MOVIMENTI (Entrate & Uscite) ══════════ */
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const isIncomeCategory = (cat) => INCOME_CATEGORIES.includes(cat);
    function itDateLabel(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-');
      return `${d} ${(MESI_IT[parseInt(m, 10) - 1] || '').slice(0, 3)} ${y}`;
    }
    function itMonthLabel(key) {
      if (!key) return '—';
      const [y, m] = key.split('-');
      return `${(MESI_IT[parseInt(m, 10) - 1] || '').replace(/^./, c => c.toUpperCase())} ${y}`;
    }
    const STATUS_BADGE = { 'Completato': 'badge-sage', 'In sospeso': 'badge-gold', 'Ricorrente': 'badge-teal' };

    function AmountDisplay({ amount, type, size = 13 }) {
      const v = Math.abs(Number(amount) || 0);
      const income = type === 'income';
      return (
        <span className="mono-font" style={{ color: income ? C.sage : C.rust, fontSize: size, fontWeight: 500, whiteSpace: 'nowrap' }} title={income ? 'Entrata' : 'Uscita'}>
          {income ? '▲ +' : '▼ −'}{fmtEUR2(v).replace('€', '').trim()} €
        </span>
      );
    }

    function CategoryBadge({ category }) {
      return <span className={`badge ${isIncomeCategory(category) ? 'badge-sage' : 'badge-neutral'}`}>{category || '—'}</span>;
    }
    function TypeBadge({ type }) {
      return <span className={`badge ${type === 'income' ? 'badge-sage' : 'badge-rust'}`}>{type === 'income' ? 'Entrata' : 'Uscita'}</span>;
    }
    function StatusBadge({ status }) {
      return <span className={`badge ${STATUS_BADGE[status] || 'badge-neutral'}`}>{status || '—'}</span>;
    }

    function SummaryCard({ label, value, hint, trend, accent, invertTrend }) {
      const has = trend !== null && trend !== undefined && isFinite(trend);
      const positive = invertTrend ? trend < 0 : trend > 0;
      const TrendIc = trend >= 0 ? Ic.up : Ic.down;
      return (
        <div className={`bento-card span-3 ${accent || ''}`}>
          <div className="card-eyebrow" style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.14em', textTransform: 'uppercase' }}>{label}</div>
          <div className="display-font number-display" style={{ fontSize: 30, marginTop: 8, lineHeight: 1.1 }}>{value}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
            {has && trend !== 0 && (
              <span className="mono-font" style={{ fontSize: 11, color: positive ? C.sage : C.rust, display: 'inline-flex', alignItems: 'center', gap: 3 }}>
                <TrendIc /> {fmtPct(Math.abs(trend))}
              </span>
            )}
            {hint && <span style={{ fontSize: 11, color: C.textMuted, fontStyle: 'italic' }}>{hint}</span>}
          </div>
        </div>
      );
    }

    function TransactionFilters({ filters, onChange, onReset }) {
      const set = (k, v) => onChange({ ...filters, [k]: v });
      const active = filters.from || filters.to || filters.query || (filters.type && filters.type !== 'all') || (filters.category && filters.category !== 'all');
      return (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 14, alignItems: 'flex-end' }}>
          <div>
            <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.14em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Dal</label>
            <input type="date" className="input-cell" value={filters.from} onChange={e => set('from', e.target.value)} />
          </div>
          <div>
            <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.14em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Al</label>
            <input type="date" className="input-cell" value={filters.to} onChange={e => set('to', e.target.value)} />
          </div>
          <div>
            <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.14em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Tipo</label>
            <select className="input-cell" value={filters.type} onChange={e => set('type', e.target.value)} style={{ background: C.card }}>
              <option value="all">Tutti</option>
              <option value="income">Entrate</option>
              <option value="expense">Uscite</option>
            </select>
          </div>
          <div>
            <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.14em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Categoria</label>
            <select className="input-cell" value={filters.category} onChange={e => set('category', e.target.value)} style={{ background: C.card }}>
              <option value="all">Tutte</option>
              <optgroup label="Entrate">{INCOME_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
              <optgroup label="Uscite">{EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
            </select>
          </div>
          <div style={{ flex: 1, minWidth: 200 }}>
            <label style={{ fontSize: 10, color: C.textMuted, letterSpacing: '0.14em', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Cerca</label>
            <input type="text" className="input-cell" placeholder="Descrizione o nota…" value={filters.query} onChange={e => set('query', e.target.value)} />
          </div>
          {active && (
            <button className="btn-ghost" onClick={onReset} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: 38 }}>
              <Ic.reset /> Reimposta
            </button>
          )}
        </div>
      );
    }

    function SortHead({ label, col, sort, onSort, align }) {
      const active = sort.key === col;
      return (
        <th className="sortable" onClick={() => onSort(col)} style={align === 'right' ? { textAlign: 'right' } : {}}>
          {label}{active ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : ''}
        </th>
      );
    }

    function TransactionTable({ rows, sort, onSort, onEdit, onDelete, selectedIds, onToggleRow, onToggleAll, allSelected, someSelected }) {
      const sel = selectedIds || new Set();
      return (
        <div>
          <div className="desktop-table" style={{ overflowX: 'auto' }}>
