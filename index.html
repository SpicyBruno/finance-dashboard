<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prospetto Finanziario Personale — Dashboard</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0e0c">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanze">
  <link
    href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@200;300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
    rel="stylesheet">
  <!-- Librerie servite in locale: la PWA funziona davvero offline -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/prop-types.min.js"></script>
  <script src="vendor/Recharts.js"></script>
  <!-- pdf.js e tesseract.js si caricano su richiesta (vedi loadScript in src/app.jsx) -->

  <style>
    :root {
      --font-ui: 'Stack Sans Notch', system-ui, sans-serif;
      --font-number: 'Stack Sans Notch', system-ui, sans-serif;
      --font-display: 'Source Serif 4', Georgia, serif;
      --bg: #0f0e0c;
      --bg-2: #14120f;
      --card: #1a1815;
      --card-solid: #1a1815;
      --card-hover: #211e1a;
      --border: #2d2925;
      --border-light: #3a342e;
      --text: #f5f1ea;
      --text-dim: #a39588;
      --text-muted: #8a8076;
      --gold: #c9a961;
      /* Alzati per superare 4.5:1 come testo sul fondo scuro: come tinte
         piene erano corretti, come testo stavano fra 3.9 e 4.5. */
      --gold-dim: #b09455;
      --rust: #cf7549;
      --sage: #6b8e6f;
      --danger: #e06a6a;
      --purple: #a888b8;
      --teal: #8fb3c2;
      --shadow: rgba(0, 0, 0, 0.26);
      --on-accent: #0f0e0c;
      --body-gradient: radial-gradient(1200px 600px at -10% -10%, rgba(201, 169, 97, 0.06), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(184, 92, 56, 0.05), transparent 60%);
      --image-opacity: 0.08;
      --image-blend: screen;
      --page-overlay: linear-gradient(180deg, rgba(15, 14, 12, 0.3), rgba(15, 14, 12, 0.58));
      --nav-bg: linear-gradient(180deg, var(--bg-2), var(--bg));
      --topbar-bg: linear-gradient(180deg, var(--bg-2), transparent);
      --card-bg: linear-gradient(180deg, var(--card), var(--bg-2));
      --surface-soft: rgba(255, 255, 255, 0.025);
      --surface-hover: rgba(255, 255, 255, 0.03);
      --accent-soft: rgba(201, 169, 97, 0.08);
      --accent-subtle: rgba(201, 169, 97, 0.06);
      --accent-selected: rgba(201, 169, 97, 0.1);
      --modal-backdrop: rgba(0, 0, 0, 0.62);
      --income-soft: rgba(107, 142, 111, 0.12);
      --expense-soft: rgba(184, 92, 56, 0.12);
      --income-text: #9bc09f;
      --expense-text: #d98a63;
      --badge-sage-text: #9bc09f;
      --badge-rust-text: #d98a63;
      --badge-teal-text: #8fb3c2;
      --badge-purple-text: #b193c0;
      --badge-gold-text: #c9a961;

      /* ── Raggi ── */
      --radius-hero: 16px;
      --radius-card: 12px;
      --radius-control: 8px;

      /* ── Scala tipografica ──
         Prima esistevano nove misure senza sistema: 9/10/11/12/13/14/15/22/30.
         Queste sono i soli gradini ammessi. */
      --t-eyebrow: 10px;
      --t-micro: 11px;
      --t-body: 13px;
      --t-title: clamp(15px, 1.1vw, 19px);
      --t-stat: clamp(21px, 2.1vw, 27px);
      --t-hero: clamp(44px, 6.2vw, 84px);

      /* ── Serie dei grafici ──
         Rampa ordinata ruggine → oro per il denaro che esce, salvia per
         quello che resta. Sostituisce cinque tinte scorrelate alla stessa
         luminosità, che non comunicavano alcun ordine. */
      --chart-1: #b85c38;
      --chart-2: #c07347;
      --chart-3: #c48f52;
      --chart-4: #c9a961;
      --chart-5: #a89263;
      --chart-retained: #6b8e6f;

      /* ── Superficie hero ── */
      --hero-bg: linear-gradient(152deg, #221e19 0%, #17150f 58%, #131109 100%);
      --hero-veil: radial-gradient(680px 340px at 88% 6%, rgba(201, 169, 97, 0.16), transparent 62%),
        linear-gradient(180deg, rgba(15, 14, 12, 0.16), rgba(15, 14, 12, 0.66));
      --hero-image-opacity: 0.20;
      --hero-shadow: 0 26px 60px -18px rgba(0, 0, 0, 0.72);
      --overlay-shadow: 0 28px 72px -20px rgba(0, 0, 0, 0.7);
      --sheet-bg: #1c1a16;
    }

    html[data-theme="light"] {
      --bg: #f5f0e7;
      --bg-2: #ebe2d4;
      --card: rgba(255, 252, 246, 0.88);
      --card-solid: #fffaf2;
      --card-hover: rgba(255, 252, 246, 0.96);
      --border: rgba(94, 75, 52, 0.18);
      --border-light: rgba(94, 75, 52, 0.3);
      --text: #241d16;
      --text-dim: #6e5d4b;
      --text-muted: #776b5b;
      /* Scuriti per superare 4.5:1 come testo sul fondo chiaro: l'oro stava a
         3.63, il gold-dim addirittura a 1.61 (oro chiaro su carta chiara). */
      --gold: #8a6419;
      --gold-dim: #7a6224;
      --rust: #a44f32;
      --sage: #4e6e53;
      --danger: #b23a3a;
      --purple: #745982;
      --teal: #46707d;
      --shadow: rgba(76, 56, 32, 0.12);
      --on-accent: #fffaf2;
      --body-gradient: linear-gradient(135deg, rgba(255, 252, 246, 0.84), rgba(245, 240, 231, 0.9)),
        radial-gradient(1200px 600px at -10% -10%, rgba(159, 118, 38, 0.12), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(164, 79, 50, 0.08), transparent 60%);
      --image-opacity: 0.13;
      --image-blend: multiply;
      --page-overlay: linear-gradient(180deg, rgba(255, 252, 246, 0.76), rgba(245, 240, 231, 0.88)),
        radial-gradient(900px 620px at 70% 0%, rgba(255, 250, 242, 0.62), transparent 70%);
      --nav-bg: linear-gradient(180deg, rgba(255, 250, 242, 0.94), rgba(235, 226, 212, 0.9));
      --topbar-bg: linear-gradient(180deg, rgba(255, 250, 242, 0.92), rgba(255, 250, 242, 0.62), transparent);
      --card-bg: linear-gradient(180deg, var(--card), rgba(255, 250, 242, 0.74));
      --surface-soft: rgba(255, 252, 246, 0.58);
      --surface-hover: rgba(159, 118, 38, 0.06);
      --accent-soft: rgba(159, 118, 38, 0.1);
      --accent-subtle: rgba(159, 118, 38, 0.08);
      --accent-selected: rgba(159, 118, 38, 0.12);
      --modal-backdrop: rgba(55, 42, 29, 0.34);
      --income-soft: rgba(86, 122, 92, 0.13);
      --expense-soft: rgba(164, 79, 50, 0.13);
      --income-text: #3f6546;
      --expense-text: #8d422c;
      --badge-sage-text: #3f6546;
      --badge-rust-text: #8d422c;
      --badge-teal-text: #3f6874;
      --badge-purple-text: #654a72;
      /* Il badge oro sta su un fondo già dorato: serve più scuro del testo oro */
      --badge-gold-text: #6f5012;

      --chart-1: #a44f32;
      --chart-2: #b06438;
      --chart-3: #b07e33;
      --chart-4: #9f7626;
      --chart-5: #8a6b34;
      --chart-retained: #567a5c;

      --hero-bg: linear-gradient(152deg, #fffdf8 0%, #f6efe1 56%, #efe4d1 100%);
      --hero-veil: radial-gradient(680px 340px at 88% 6%, rgba(159, 118, 38, 0.14), transparent 62%),
        linear-gradient(180deg, rgba(255, 252, 246, 0.30), rgba(238, 228, 210, 0.44));
      --hero-image-opacity: 0.16;
      --hero-shadow: 0 24px 54px -20px rgba(76, 56, 32, 0.34);
      --overlay-shadow: 0 28px 72px -20px rgba(76, 56, 32, 0.3);
      --sheet-bg: #fffaf2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      font-variant-numeric: tabular-nums lining-nums;
    }

    body {
      background-image: var(--body-gradient);
      background-attachment: fixed;
      position: relative;
      min-height: 100dvh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('download (42).jpg') center/cover no-repeat;
      opacity: var(--image-opacity);
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: var(--image-blend);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--page-overlay);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
    }

    input,
    select,
    textarea {
      color: var(--text) !important;
      color-scheme: dark;
      font-family: inherit;
    }

    button,
    input,
    select,
    textarea {
      min-height: 44px;
    }

    input::placeholder {
      color: var(--text-muted) !important;
    }

    select option {
      background: var(--card-solid);
      color: var(--text);
    }

    html[data-theme="light"] input,
    html[data-theme="light"] select,
    html[data-theme="light"] textarea {
      color-scheme: light;
    }

    .display-font {
      font-family: var(--font-display);
      font-optical-sizing: auto;
      letter-spacing: -0.01em;
    }

    .number-display {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }

    .mono-font {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }

    button {
      font-family: inherit;
    }

    /* ── App shell ── */
    .app-shell {
      display: grid;
      grid-template-columns: 72px 1fr;
      min-height: 100dvh;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--nav-bg);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100dvh;
      z-index: 10;
    }

    .sidebar-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: radial-gradient(circle at 30% 30%, var(--gold), var(--gold-dim));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.55);
    }

    .side-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
      position: relative;
    }

    .side-label {
      display: none;
    }

    @media (hover: hover) {
      .side-btn:hover {
        color: var(--text);
        border-color: var(--border);
        background: var(--surface-hover);
      }
    }

    /* Lo stato attivo lo dicono già colore, fondo e bordo: l'alone dorato
       interno era solo decorazione. */
    .side-btn.active {
      color: var(--gold);
      background: var(--accent-soft);
      border-color: var(--gold-dim);
    }

    .side-btn .tooltip {
      position: absolute;
      left: 54px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      border-radius: 4px;
      z-index: 100;
    }

    @media (hover: hover) {
      .side-btn:hover .tooltip {
        opacity: 1;
      }
    }

    /* ── Main area ── */
    .main-area {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 24px 32px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--topbar-bg);
      backdrop-filter: blur(14px);
    }

    .topbar-title .eyebrow {
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .topbar-title h1 {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .topbar-title h1 span,
    .card-title span,
    .display-font {
      font-style: normal !important;
    }

    .topbar-meta {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 7px 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.06em;
      border-radius: 6px;
    }

    .icon-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--accent-subtle);
    }

    .input-cell {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text) !important;
      padding: 8px 4px;
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 14px;
      width: 100%;
      transition: border-color 0.2s;
    }

    .input-cell:focus {
      outline: none;
      border-bottom-color: var(--gold);
    }

    .input-label {
      font-family: var(--font-ui);
      background: transparent;
      border: none;
      color: var(--text) !important;
      padding: 8px 4px;
      font-size: 14px;
      width: 100%;
      border-bottom: 1px solid transparent;
    }

    .input-label:focus {
      outline: none;
      border-bottom-color: var(--gold);
    }

    /* ── Content / bento ── */
    main {
      padding: 24px 32px 48px;
      flex: 1;
    }

    .bento {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: minmax(140px, auto);
      gap: 16px;
    }

    /* ── Livello 2: pannello ──
       Elevazione dichiarata una sola volta, col bordo. Prima c'era un bordo da
       1px sotto un'ombra larga: la "ghost card", il motivo per cui ogni
       riquadro sembrava galleggiare allo stesso identico modo. */
    .bento-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 22px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
      backdrop-filter: blur(12px);
    }

    @media (hover: hover) {
      .bento-card:hover {
        border-color: var(--border-light);
      }
    }

    /* ── Livello 1: hero ──
       Un solo pannello per schermata. Nessun bordo: qui l'elevazione la porta
       l'ombra, così il livello si distingue da solo dai pannelli. */
    .card-hero {
      grid-column: span 12;
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: var(--radius-hero);
      padding: clamp(22px, 2.8vw, 40px);
      background: var(--hero-bg);
      box-shadow: var(--hero-shadow);
    }

    .card-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('download (42).jpg') center/cover no-repeat;
      opacity: var(--hero-image-opacity);
      mix-blend-mode: var(--image-blend);
      pointer-events: none;
    }

    .card-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--hero-veil);
      pointer-events: none;
    }

    .card-hero>* {
      position: relative;
      z-index: 1;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr);
      gap: clamp(20px, 3vw, 48px);
      align-items: center;
    }

    .hero-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: var(--t-hero);
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.03em;
      color: var(--gold);
      margin-top: 10px;
    }

    .hero-label {
      font-size: var(--t-eyebrow);
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .hero-delta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: var(--t-body);
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .hero-delta.up {
      color: var(--badge-sage-text);
      background: var(--income-soft);
      border-color: rgba(107, 142, 111, 0.35);
    }

    .hero-delta.down {
      color: var(--badge-rust-text);
      background: var(--expense-soft);
      border-color: rgba(184, 92, 56, 0.35);
    }

    .hero-foot {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: clamp(18px, 2.4vw, 30px);
      padding-top: clamp(16px, 2vw, 24px);
      border-top: 1px solid var(--border);
    }

    .hero-aside {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    /* ── Livello 3: dato secondario ──
       Nessun riquadro. Un solo bordo per il gruppo, filetti da 1px fra le
       celle: i numeri piccoli smettono di fingersi titoli. */
    /* I filetti sono i gap della griglia, non bordi per cella: restano corretti
       a qualunque numero di colonne, senza regole :last-child per breakpoint. */
    .stat-strip {
      grid-column: span 12;
      display: grid;
      grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--border);
      overflow: hidden;
    }

    .stat-tile {
      padding: 18px 22px;
      background: var(--card-solid);
      min-width: 0;
    }

    .stat-label {
      font-size: var(--t-eyebrow);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 9px;
    }

    .stat-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: var(--t-stat);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .stat-value .unit {
      font-size: var(--t-body);
      color: var(--text-muted);
      margin-left: 5px;
    }

    .stat-hint {
      font-size: var(--t-micro);
      color: var(--text-dim);
      margin-top: 7px;
    }

    /* ── Elenco spese ordinato ──
       Sostituisce la torta a dieci spicchi: le etichette venivano troncate a
       metà parola e sul telefono sparivano del tutto. */
    .rank-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 12px;
      padding: 9px 0;
    }

    .rank-name {
      font-size: var(--t-body);
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .rank-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: var(--t-body);
      color: var(--text);
      text-align: right;
    }

    .rank-bar {
      grid-column: 1 / -1;
      height: 5px;
      border-radius: 3px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .rank-bar span {
      display: block;
      height: 100%;
      border-radius: 3px;
    }

    .rank-share {
      grid-column: 2;
      grid-row: 1;
      font-size: var(--t-micro);
      color: var(--text-muted);
    }

    .bento-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(600px 200px at 100% 0%, rgba(159, 118, 38, 0.08), transparent 60%);
    }

    .bento-card.accent-rust::before {
      background: radial-gradient(500px 200px at 0% 100%, rgba(164, 79, 50, 0.09), transparent 60%);
    }

    .bento-card.accent-sage::before {

    }

    .bento-card>* {

    }

    }

    .span-5 {
      grid-column: span 5;
    }

    .span-6 {
      grid-column: span 6;
    }

    .span-7 {
      grid-column: span 7;
    }

      grid-column: span 8;
    }

      grid-column: span 9;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: var(--t-title);
      font-weight: 500;
      font-style: normal;
      color: var(--text);
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title .diamond {
      color: var(--gold);
      margin-right: 6px;
    }

    .card-eyebrow {
      font-size: var(--t-eyebrow);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .kpi-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: var(--t-stat);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-style: normal;
      margin-top: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 12px 0;
      margin-right: 22px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 14px;
      letter-spacing: 0.02em;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      font-style: normal;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .row-delete {
      opacity: 0;
      transition: opacity 0.2s;
    }

    .data-row:hover .row-delete {
      opacity: 1;
    }

    .recharts-cartesian-axis-tick-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 11px;
    }

    /* Progress bar */
    .progress-track {
      position: relative;
      height: 8px;
      background: rgba(94, 75, 52, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    /* Tacca sul valore obiettivo (target di allocazione, soglie della rata) */
    .target-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      margin-left: -1px;
      background: var(--text);
      opacity: 0.75;
    }

    /* Avanzamento senza percentuale nota: una barra che scorre */
    .progress-track.indeterminate .progress-fill {
      animation: indeterminate 1.3s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }

    @keyframes indeterminate {
      from { transform: translateX(-35%) scaleX(0.35); }
      to { transform: translateX(100%) scaleX(0.35); }
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      border-radius: 4px;
      transform-origin: left center;
      transform: scaleX(var(--fill, 0));
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill {
        transition: none;
      }

      .progress-track.indeterminate .progress-fill {
        animation: none;
        transform: scaleX(0.35);
      }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: var(--on-accent);
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      z-index: 1000;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
      pointer-events: none;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes toastOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    /* ── Movimenti: badge, modal, tabella ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .badge-sage { background: var(--income-soft); color: var(--badge-sage-text); border-color: rgba(107, 142, 111, 0.35); }
    .badge-rust { background: var(--expense-soft); color: var(--badge-rust-text); border-color: rgba(184, 92, 56, 0.35); }
    .badge-gold { background: var(--accent-subtle); color: var(--badge-gold-text); border-color: rgba(201, 169, 97, 0.35); }
    .badge-teal { background: rgba(107, 142, 156, 0.14); color: var(--badge-teal-text); border-color: rgba(107, 142, 156, 0.35); }
    .badge-purple { background: rgba(139, 111, 156, 0.14); color: var(--badge-purple-text); border-color: rgba(139, 111, 156, 0.35); }
    .badge-neutral { background: rgba(94, 75, 52, 0.07); color: var(--text-dim); border-color: var(--border); }

    .tx-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 880px; }
    .tx-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .tx-table th.sortable { cursor: pointer; user-select: none; transition: color 0.15s; }
    .tx-table th.sortable:hover { color: var(--text-dim); }
    .tx-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tx-table tbody tr { transition: background 0.15s; }
    @media (hover: hover) { .tx-table tbody tr:hover { background: var(--surface-hover); } }
    .tx-table th.sel, .tx-table td.sel { width: 34px; text-align: center; padding-left: 10px; padding-right: 4px; }
    .tx-table tbody tr.selected { background: var(--accent-soft); }
    .tx-table tbody tr.selected:hover { background: var(--accent-selected); }
    .tx-bulkbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--accent-subtle); }
    .btn-danger {
      background: transparent; border: 1px solid var(--danger); color: var(--danger);
      padding: 8px 14px; cursor: pointer; font-family: inherit; font-size: 12px; letter-spacing: 0.06em;
      border-radius: 6px; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-danger:hover { background: rgba(197, 69, 69, 0.12); }
    .tx-desc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-mobile-list { display: none; }
    .tx-mobile-card {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .tx-mobile-card.selected {
      border-color: var(--gold-dim);
      background: var(--accent-soft);
    }
    .tx-mobile-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .tx-mobile-desc {
      color: var(--text);
      font-size: 15px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .tx-mobile-meta,
    .tx-mobile-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tx-mobile-meta {
      color: var(--text-dim);
      font-size: 12px;
    }
    .tx-mobile-actions {
      justify-content: space-between;
      padding-top: 4px;
    }
    .tx-action-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 6px;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
    }
    @media (hover: hover) {
      .tx-action-btn:hover { color: var(--text); border-color: var(--border-light); background: var(--surface-hover); }
      .tx-action-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
    }

    /* ── Riga movimento (mobile) ──
       L'importo comanda: prima era più piccolo dei tre badge accanto a lui. */
    .tx-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
    }

    .tx-row.selected {
      border-color: var(--gold-dim);
      background: var(--accent-soft);
    }

    .tx-row-check {
      min-height: 0;
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--gold);
      flex-shrink: 0;
    }

    /* Tutta la riga è il bersaglio per modificare: descrizione, badge e
       importo stanno dentro un solo pulsante */
    .tx-row-open {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      width: 100%;
      min-height: 0;
      padding: 0;
      background: none;
      border: 0;
      border-radius: 6px;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .tx-row-open:active {
      opacity: 0.7;
    }

    /* La riga dei metadati passa sotto anche all'importo e prende tutta la
       larghezza: accanto all'importo i badge restavano troncati */
    .tx-row-open {
      grid-template-areas: "desc amount" "sub sub";
      row-gap: 7px;
    }
    .tx-row-open .tx-row-main { display: contents; }
    .tx-row-open .tx-row-desc { grid-area: desc; }
    .tx-row-open .tx-row-sub { grid-area: sub; margin-top: 0; }
    .tx-row-open .tx-row-right { grid-area: amount; }

    .tx-row-main {
      display: block;
      min-width: 0;
    }

    .tx-row-desc {
      display: block;
      font-size: 15px;
      line-height: 1.3;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .tx-row-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow: hidden;
      margin-top: 7px;
    }

    /* Il metodo di pagamento è l'informazione meno urgente della riga:
       è lui a cedere spazio quando non ci sta tutto. */
    .tx-row-sub .tx-row-method {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    /* Le categorie lunghe ("Affitto / Mutuo") accorciano invece di sfondare */
    .tx-row-sub .badge {
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: 100%;
    }

    .tx-row-day {
      flex-shrink: 0;
    }

    /* Sotto i 520px il metodo di pagamento non ci sta senza tagliare i badge.
       È il dato meno urgente della riga: resta nella tabella e nella modale. */
    @media (max-width: 520px) {
      .tx-row-method {
        display: none;
      }
    }

    .tx-row-method {
      font-size: var(--t-micro);
      color: var(--text-muted);
    }

    .tx-row-day {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: var(--t-micro);
      color: var(--text-dim);
      white-space: nowrap;
    }

    .tx-row-note {
      font-size: var(--t-micro);
      color: var(--text-dim);
      line-height: 1.45;
      margin-top: 6px;
    }

    .tx-row-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      text-align: right;
    }

    .tx-row-actions {
      display: flex;
      gap: 6px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-backdrop);
      backdrop-filter: blur(3px);
      z-index: 1001;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(48px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      overflow-y: auto;
      animation: overlayIn 0.18s ease;
    }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      width: min(560px, 96vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      /* Era un marrone caldo fisso, pensato per il tema chiaro e applicato
         anche a quello scuro, dove diventava un alone colorato. */
      box-shadow: var(--overlay-shadow);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    .modal-card-wide { width: min(880px, 96vw); }
    /* La zona di caricamento è un <label> collegato a un input nascosto
       (vedi .file-input): il selettore di file si apre col gesto nativo */
    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 1.5px dashed var(--border-light);
      border-radius: 10px;
      padding: 32px 20px;
      text-align: center;
      color: var(--text-dim);
      background: var(--surface-soft);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, color 0.18s;
    }
    @media (hover: hover) {
      .dropzone:hover { border-color: var(--gold); background: var(--accent-subtle); }
    }
    .dropzone.dragging { border-color: var(--gold); background: var(--accent-subtle); }
    .dropzone:active { background: var(--accent-subtle); }
    .dropzone.busy { cursor: progress; border-style: solid; border-color: var(--gold-dim); }
    .dropzone-icon { color: var(--gold); margin-bottom: 4px; display: inline-flex; }
    .dropzone-title { display: block; color: var(--text); font-size: 14px; line-height: 1.45; }
    .dropzone-hint { display: block; color: var(--text-muted); font-size: var(--t-micro); line-height: 1.5; }
    .dropzone-progress { display: grid; gap: 12px; width: min(360px, 100%); }
    .dropzone-msg { color: var(--gold); font-size: var(--t-body); }

    /* Il testo cambia col dispositivo: "trascina" non ha senso su un telefono */
    .dropzone .only-coarse { display: none; }
    .dropzone-alt { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .dropzone .only-fine { display: none; }
      .dropzone .only-coarse { display: block; }
      .dropzone-alt { display: flex; margin-top: 10px; }
    }
    .dropzone-alt .btn-ghost {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
    }
    .is-disabled { opacity: 0.5; pointer-events: none; }

    /* Nascosto alla vista ma non display:none: resta raggiungibile da
       tastiera e il <label> collegato lo apre senza click() programmatici */
    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      min-height: 0;
      margin: -1px;
      padding: 0;
      border: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      opacity: 0;
    }
    .file-input:focus-visible + label {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .inline-error {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--danger);
    }
    .inline-error svg { flex-shrink: 0; margin-top: 2px; }

    /* ── Conferma dei dati estratti dal cedolino ── */
    .import-confirm {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--gold-dim);
      border-radius: var(--radius-control);
      background: var(--accent-subtle);
      scroll-margin: 88px;
    }
    .import-confirm-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
      min-width: 0;
    }
    .import-file {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--t-micro);
      color: var(--text-muted);
    }
    .import-note { margin: 0 0 12px; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); }
    .import-fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
      gap: 0 16px;
    }
    .import-fields .modal-field { margin-bottom: 12px; }
    .amount-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 2px 0 4px; }
    .amount-chips-label {
      margin-right: 4px;
      font-size: var(--t-eyebrow);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .amount-chip {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background: var(--surface-soft);
      color: var(--text-dim);
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .amount-chip.active { border-color: var(--gold); color: var(--gold); background: var(--accent-soft); }
    @media (hover: hover) {
      .amount-chip:hover { border-color: var(--gold-dim); color: var(--text); }
    }
    .import-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

    /* ── Revisione dell'estratto conto sul telefono ── */
    .imp-card {
      display: grid;
      gap: 6px;
      padding: 10px 12px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
      transition: opacity 0.15s;
    }
    .imp-card.off { opacity: 0.55; }
    .imp-card-top { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 0.8fr); gap: 10px; align-items: center; }
    .imp-card-selects { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 10px; }
    .imp-dup { font-size: var(--t-micro); color: var(--gold); }
    .imp-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 720px; }
    .imp-table th { text-align: left; padding: 8px 8px; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .imp-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .imp-table input, .imp-table select { font-size: 12px; padding: 5px 7px; }
    .imp-table tr.dup td { opacity: 0.55; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 10px; color: var(--text-muted); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .seg-group { display: flex; gap: 8px; }
    .seg-btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.06em;
      transition: all 0.15s;
    }
    .seg-btn.active-income { border-color: rgba(107, 142, 111, 0.6); background: var(--income-soft); color: var(--income-text); }
    .seg-btn.active-expense { border-color: rgba(184, 92, 56, 0.6); background: var(--expense-soft); color: var(--expense-text); }
    .btn-primary {
      background: var(--gold); border: none; color: var(--on-accent);
      padding: 10px 20px; cursor: pointer; font-family: inherit;
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--text-dim);
      padding: 10px 18px; cursor: pointer; font-family: inherit;
      font-size: 12px; letter-spacing: 0.06em; border-radius: 6px;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--border-light); }
    @media (max-width: 560px) { .modal-grid { grid-template-columns: 1fr; } }

    .data-head {
      padding: 0 0 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
      font-size: var(--t-eyebrow);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .data-head span { padding: 0 4px; }

    .modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; }
    .modal-delete { margin-right: auto; }

    /* ══════ Hero di sezione: parti condivise ══════
       Le stesse dell'hero del Quadro, ora usate da ogni scheda */
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .hero-meta strong { font-family: var(--font-number); font-weight: 500; }
    .hero-note { max-width: 46ch; font-size: 12px; line-height: 1.5; color: var(--text-dim); }
    .aside-label {
      margin-bottom: 12px;
      font-size: var(--t-eyebrow);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .part-row { margin-bottom: 12px; }
    .part-row:last-child { margin-bottom: 0; }
    .part-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 5px;
    }
    .part-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      color: var(--text-dim);
    }
    .part-value {
      white-space: nowrap;
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 12.5px;
      color: var(--text);
    }
    .part-share { margin-left: 8px; color: var(--text-muted); }
    .recent-row { padding: 7px 0; margin: 0; border-top: 1px solid var(--border); }
    .recent-row:first-of-type { border-top: 0; padding-top: 0; }
    .arc-stat { display: flex; align-items: center; gap: 16px; }
    .hero-foot .tx-head-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
    .hero-facts { display: grid; gap: 7px; margin-top: 16px; font-size: 12px; }
    .hero-facts > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .hero-facts dt { color: var(--text-dim); }
    .hero-facts dd {
      margin: 0;
      white-space: nowrap;
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      color: var(--text);
    }
    .hero-facts.stacked > div { flex-direction: column; gap: 1px; }
    .hero-facts.stacked dd { font-size: 14px; }
    .trend-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-right: 6px;
      font-family: var(--font-number);
      font-size: var(--t-micro);
    }

    /* La cella che conta di più, in una striscia dove sono tutte uguali */
    .stat-tile.stat-key { background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--card-solid); }
    .stat-tile.stat-key .stat-value { font-size: calc(var(--t-stat) * 1.25); }

    /* ── Grafici: legenda in HTML e ciambella ── */
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin: -4px 0 12px;
      font-size: var(--t-micro);
      color: var(--text-dim);
    }
    .chart-legend > span { display: inline-flex; align-items: center; gap: 7px; }
    .chart-legend .swatch { display: inline-block; flex-shrink: 0; border-radius: 2px; }
    .chart-legend .swatch.line { width: 14px; height: 3px; }
    .chart-legend .swatch.box { width: 10px; height: 10px; border-radius: 3px; }
    .donut-box { position: relative; width: 100%; }
    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      pointer-events: none;
    }
    .donut-center-label {
      font-size: var(--t-eyebrow);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .donut-center-value {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 21px;
      letter-spacing: -0.02em;
      color: var(--gold);
    }
    .donut-legend { display: grid; margin-top: 14px; }
    .legend-row {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 7px 0;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
    }
    .legend-row .swatch { width: 10px; height: 10px; border-radius: 3px; }
    .legend-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
    .legend-value { font-family: var(--font-number); font-variant-numeric: tabular-nums lining-nums; color: var(--text); }
    .legend-share { min-width: 42px; text-align: right; font-size: var(--t-micro); color: var(--text-muted); }

    /* ── Elenchi del telefono ──
       Le tabelle larghe restano sul desktop; sul telefono diventano righe
       che non si scorrono di lato */
    .phone-list { display: none; }
    .phone-only { display: none !important; }
    .m-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .m-row.is-active { border-color: var(--gold-dim); background: var(--accent-soft); }
    .m-row-title { font-size: 15px; line-height: 1.3; color: var(--text); overflow-wrap: anywhere; }
    .m-row-sub { margin-top: 5px; font-size: var(--t-micro); line-height: 1.45; color: var(--text-dim); }
    .m-row-end { display: flex; align-items: center; gap: 10px; }
    .m-row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .m-row-value {
      white-space: nowrap;
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 17px;
    }
    .m-card {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
      min-width: 0;
    }
    .m-card-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
    .m-edit { padding: 4px 14px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-soft); }
    .m-edit-head { display: flex; align-items: center; gap: 8px; }
    .m-edit .row-delete { opacity: 1; }
    .m-edit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 14px; }
    .m-field { display: block; min-width: 0; }
    .m-field > span {
      display: block;
      margin-top: 10px;
      font-size: var(--t-eyebrow);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .m-field-wide { grid-column: 1 / -1; }

    /* ══════ Guscio mobile ══════
       Sul telefono la barra in basso conteneva nove voci in uno scroller
       orizzontale: etichette troncate ("Entrate 6…", "Movimen…") e le ultime
       due sezioni di fatto irraggiungibili. Quattro destinazioni fisse più un
       foglio "Altro" per le restanti cinque. */
    .mobile-nav {
      display: none;
    }

    .mobile-topbar {
      display: none;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: var(--modal-backdrop);
      backdrop-filter: blur(3px);
      z-index: 1200;
      animation: overlayIn 0.18s ease;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1201;
      background: var(--sheet-bg);
      border-top: 1px solid var(--border-light);
      border-radius: 18px 18px 0 0;
      padding: 10px calc(12px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      max-height: 82dvh;
      overflow-y: auto;
      box-shadow: 0 -18px 48px -12px rgba(0, 0, 0, 0.5);
      animation: sheetIn 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes sheetIn {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .sheet,
      .sheet-backdrop,
      .modal-card,
      .modal-overlay {
        animation: none;
      }
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-light);
      margin: 4px auto 12px;
    }

    .sheet-title {
      font-family: var(--font-display);
      font-size: var(--t-title);
      color: var(--text);
      padding: 0 10px 10px;
    }

    .sheet-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 56px;
      padding: 12px 10px;
      background: transparent;
      border: none;
      border-radius: var(--radius-control);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .sheet-row .sheet-chevron {
      margin-left: auto;
      color: var(--text-muted);
    }

    .sheet-row.active {
      color: var(--gold);
      background: var(--accent-soft);
    }

    .fab {
      display: none;
      position: fixed;
      right: calc(16px + env(safe-area-inset-right));
      bottom: calc(78px + env(safe-area-inset-bottom));
      z-index: 90;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: var(--gold);
      color: var(--on-accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
    }

    .tx-day-head {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 2px 8px;
      background: var(--bg);
      font-size: var(--t-eyebrow);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Il chip filtri è mobile-only; la scheda filtri è desktop-only */
    .tx-filter-chip-wrap {
      display: none;
    }

    @media (max-width: 780px) {
      .tx-filter-card {
        display: none;
      }

      .tx-filter-chip-wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        grid-column: span 6;
      }

      .tx-filter-chip-wrap .month-chip {
        justify-content: center;
      }

      .tx-head-actions {
        display: none !important;
      }
    }

    .tx-day-head .day-total {
      font-family: var(--font-number);
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: 0.04em;
      color: var(--text-dim);
    }

    /* ── Responsive ── */
    /* Quattro celle in fila stanno larghe solo sul desktop pieno */
    @media (max-width: 1000px) {
      .stat-strip[data-cols="4"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1200px) {

      .span-3,
      .span-4 {
        grid-column: span 6;
      }

      .span-5,
      .span-7 {
        grid-column: span 6;
      }

      .span-8,
      .span-9 {
        grid-column: span 12;
      }
    }

    @media (max-width: 780px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      /* La barra laterale è desktop-only: sul telefono comanda .mobile-nav */
      .sidebar {
        display: none;
      }

      .mobile-nav {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        border-top: 1px solid var(--border);
        padding: 6px calc(4px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left));
        background: var(--nav-bg);
        backdrop-filter: blur(18px);
        z-index: 100;
      }

      .nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 56px;
        padding: 6px 2px;
        background: transparent;
        border: none;
        border-radius: 10px;
        color: var(--text-muted);
        cursor: pointer;
        font-family: inherit;
        position: relative;
        transition: color 0.18s;
      }

      .nav-btn svg {
        width: 21px;
        height: 21px;
      }

      .nav-label {
        font-size: 10.5px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .nav-btn.active {
        color: var(--gold);
      }

      .nav-btn.active::before {
        content: '';
        position: absolute;
        top: -6px;
        width: 26px;
        height: 2px;
        border-radius: 0 0 2px 2px;
        background: var(--gold);
      }

      /* La pagina va a tutto schermo (viewport-fit=cover + status bar
         translucida): senza questo margine la barra finisce sotto l'orologio e
         la batteria del telefono, e i suoi bottoni non si riescono a premere. */
      .mobile-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        position: sticky;
        top: 0;
        z-index: 80;
        min-height: calc(56px + env(safe-area-inset-top));
        padding: calc(8px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 8px calc(14px + env(safe-area-inset-left));
        border-bottom: 1px solid var(--border);
        background: var(--topbar-bg);
        backdrop-filter: blur(14px);
      }

      .mobile-topbar h1 {
        font-family: var(--font-display);
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.01em;
        margin-right: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .month-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface-soft);
        color: var(--text-dim);
        font-family: inherit;
        font-size: var(--t-body);
        white-space: nowrap;
        cursor: pointer;
      }

      /* La barra desktop sparisce: erano cinque bottoni di pari peso che si
         mangiavano tutta la prima schermata, senza un solo numero visibile */
      .topbar {
        display: none;
      }

      main {
        padding: 14px calc(14px + env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
      }

      .bento {
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        /* In colonna singola il minimo di 140px lasciava aria in fondo a ogni
           scheda corta: qui l'altezza la decide il contenuto */
        grid-auto-rows: auto;
      }

      /* I riquadri larghi restano a tutta larghezza… */
      .span-5,
      .span-6,
      .span-7,
      .span-8,
      .span-9,
      .span-12,
      .card-hero,
      .stat-strip {
        grid-column: span 6;
      }

      /* …i dati piccoli vanno a due per riga: prima ogni scheda prendeva tutta
         la larghezza e il Quadro era uno scroll di circa 3.100px */
      .span-3,
      .span-4 {
        grid-column: span 3;
      }

      /* …ma un grafico mai: a metà colonna la ciambella usciva dalla scheda */
      .chart-card {
        grid-column: span 6;
      }

      .stat-tile {
        padding: 14px 12px;
      }

      .phone-list {
        display: grid;
        gap: 8px;
      }

      .phone-only {
        display: inline-flex !important;
      }

      .desktop-only {
        display: none !important;
      }

      .scenario-pair {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .hero-foot .tx-head-actions {
        display: none;
      }

      .import-actions {
        flex-direction: column-reverse;
      }

      .import-actions > * {
        width: 100%;
        justify-content: center;
      }

      .amount-chip {
        min-height: 44px;
      }

      /* ── Modali come fogli dal basso ──
         Prima erano schede centrate con 48px d'aria sopra e sotto e
         max-height 90vh: sul telefono il pulsante per salvare finiva sotto la
         tastiera o oltre il bordo. Ora occupano lo schermo dal basso e la
         barra delle azioni resta ancorata in fondo. */
      .modal-overlay {
        align-items: flex-end;
        padding: calc(12px + env(safe-area-inset-top)) 0 0;
        overflow: hidden;
      }

      .modal-card,
      .modal-card-wide {
        width: 100%;
        max-height: 100%;
        border-radius: 18px 18px 0 0;
        border-bottom: 0;
        background: var(--sheet-bg);
        padding: 20px calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
        animation: sheetIn 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .modal-actions {
        position: sticky;
        bottom: 0;
        z-index: 2;
        margin: 14px calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
        padding: 12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
        background: var(--sheet-bg);
        border-top: 1px solid var(--border);
      }

      .modal-actions .btn-primary {
        flex: 1;
        justify-content: center;
      }

      /* Tre pulsanti con testo non stanno in 390px: Elimina resta icona */
      .modal-delete {
        min-width: 44px;
        justify-content: center;
        padding: 8px 12px;
      }

      .modal-delete-label {
        display: none;
      }

      .row-2 {
        grid-row: auto;
      }

      .bento-card {
        padding: 16px;
      }

      .card-hero {
        padding: 20px 18px;
      }

      .hero-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
      }

      .hero-foot {
        gap: 14px;
        margin-top: 18px;
        padding-top: 16px;
      }

      .input-cell,
      .input-label,
      .imp-table input,
      .imp-table select {
        font-size: 16px;
        padding: 11px 6px;
      }

      .desktop-table {
        display: none;
      }

      .tx-mobile-list {
        display: grid;
        gap: 8px;
      }

      .fab {
        display: inline-flex;
      }

      .data-edit-row {
        grid-template-columns: minmax(0, 1fr) minmax(76px, 32%) 44px !important;
        gap: 10px !important;
        padding: 8px 0 !important;
      }

      .data-edit-row[data-fields="3"] {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px !important;
        row-gap: 0 !important;
      }

      .data-edit-row[data-fields="3"] > :first-child {
        grid-column: 1 / -1;
      }

      .data-head.data-edit-row > :first-child {
        display: none;
      }

      .data-edit-row .row-delete {
        opacity: 1;
        min-width: 44px;
        min-height: 44px;
      }

      /* Il cestino restava largo 14px: il bersaglio è il bottone, non l'icona */
      .row-delete {
        min-width: 44px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .toast {
        bottom: calc(94px + env(safe-area-inset-bottom));
        width: calc(100vw - 32px);
        text-align: center;
      }

      footer {
        padding: 20px 16px !important;
      }
    }

    @media (max-width: 480px) {
      .tab-btn {
        margin-right: 14px;
        font-size: 15px;
      }

      /* Tre celle affiancate a 390px sarebbero larghe 120px: si passa a due,
         e se ne resta una dispari prende tutta la larghezza. Restano comunque
         due righe invece di tre schede impilate a piena altezza. */
      .stat-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-tile {
        padding: 14px 14px;
      }

      .stat-tile:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }

      .icon-btn,
      .btn-primary,
      .btn-ghost,
      .btn-danger {
        font-size: 13px;
      }
    }

    /* ── Movimento ──
       Il momento d'autore è l'hero: il numero sale e la sparkline si disegna.
       Tutto il resto entra una volta sola e si toglie di mezzo. */
    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        animation: reveal 0.52s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      .hero-spark path {
        stroke-dasharray: var(--spark-len, 600);
        stroke-dashoffset: var(--spark-len, 600);
        animation: sparkDraw 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }

      @keyframes sparkDraw {
        to {
          stroke-dashoffset: 0;
        }
      }
    }

    /* Con moto ridotto la sparkline resta disegnata: nessuno stato intermedio */
    @media (prefers-reduced-motion: reduce) {
      .hero-spark path {
        stroke-dashoffset: 0;
      }
    }

    /* ── Stati tattili ──
       Su touch :hover non esiste: senza :active un tocco non dà alcun ritorno. */
    .icon-btn:active,
    .btn-primary:active,
    .btn-ghost:active,
    .btn-danger:active,
    .side-btn:active,
    .seg-btn:active,
    .tx-action-btn:active,
    .sheet-row:active {
      transform: scale(0.97);
    }

    :where(button, a, input, select, textarea):focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      border-radius: var(--radius-control);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script src="app.js"></script>

  <!-- Se una libreria locale non si carica, senza questo la pagina resterebbe
       semplicemente bianca, senza dire perché. -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var root = document.getElementById('root');
      if (!root || root.children.length) return;
      var missing = [];
      if (!window.React) missing.push('React');
      if (!window.ReactDOM) missing.push('ReactDOM');
      if (!window.Recharts) missing.push('Recharts');
      var why = missing.length
        ? 'Non sono state caricate queste librerie: ' + missing.join(', ') + '.'
        : 'Le librerie risultano caricate, ma l\'app non è partita: controlla la console del browser.';
      root.innerHTML =
        '<div style="max-width:640px;margin:12vh auto;padding:28px;font-family:system-ui,sans-serif;' +
        'color:#f5f1ea;background:#1a1815;border:1px solid #3a342e;border-radius:12px;line-height:1.6">' +
        '<h1 style="font-size:20px;margin:0 0 12px">La dashboard non si è avviata</h1>' +
        '<p style="margin:0 0 14px;color:#a39588">' + why + '</p>' +
        '<p style="margin:0;color:#a39588">Verifica che accanto a <code>index.html</code> ci siano ' +
        '<code>app.js</code> e la cartella <code>vendor/</code>. Se hai appena modificato ' +
        '<code>src/app.jsx</code>, esegui <code style="color:#c9a961">npm run build</code>.</p>' +
        '</div>';
    });
  </script>

  <!-- Registrazione del service worker per la PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service worker non registrato:', err);
        });
      });
    }
  </script>
</body>

</html>
